apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vaultwarden.fullname" . }}
  labels:
    {{- include "vaultwarden.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "vaultwarden.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: vaultwarden
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "vaultwarden.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: vaultwarden
    spec:
      securityContext:
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}
        fsGroupChangePolicy: {{ .Values.podSecurityContext.fsGroupChangePolicy | quote }}

      {{- if .Values.mysql.enabled }}
      initContainers:
        - name: wait-mysql
          image: busybox:1.36
          command:
            - sh
            - -lc
            - |
              set -eu
              echo "Waiting for MySQL..."
              until nc -z {{ include "vaultwarden.fullname" . }}-mysql {{ .Values.mysql.service.port }}; do
                sleep 2
              done
              echo "MySQL is up."
      {{- end }}

      containers:
        - name: vaultwarden
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          securityContext:
            runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
            runAsUser: {{ .Values.securityContext.runAsUser }}
            runAsGroup: {{ .Values.securityContext.runAsGroup }}
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            capabilities:
              {{- toYaml .Values.securityContext.capabilities | nindent 14 }}

          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.dbSecretName is required" .Values.secrets.dbSecretName }}
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.dbSecretName is required" .Values.secrets.dbSecretName }}
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.dbSecretName is required" .Values.secrets.dbSecretName }}
                  key: MYSQL_PASSWORD
            - name: DATABASE_URL
              value: {{ printf "mysql://$(MYSQL_USER):$(MYSQL_PASSWORD)@%s:%v/$(MYSQL_DATABASE)" (default (printf "%s-mysql" (include "vaultwarden.fullname" .)) .Values.database.host) .Values.database.port | quote }}
            {{- if .Values.push.enabled }}
            - name: PUSH_ENABLED
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.appSecretName is required" .Values.secrets.appSecretName }}
                  key: {{ required "push.secretKeys.enabled is required" .Values.push.secretKeys.enabled }}
            - name: PUSH_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.appSecretName is required" .Values.secrets.appSecretName }}
                  key: {{ required "push.secretKeys.installationId is required" .Values.push.secretKeys.installationId }}
            - name: PUSH_INSTALLATION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.appSecretName is required" .Values.secrets.appSecretName }}
                  key: {{ required "push.secretKeys.installationKey is required" .Values.push.secretKeys.installationKey }}
            - name: PUSH_RELAY_URI
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.appSecretName is required" .Values.secrets.appSecretName }}
                  key: {{ required "push.secretKeys.relayUri is required" .Values.push.secretKeys.relayUri }}
            - name: PUSH_IDENTITY_URI
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.appSecretName is required" .Values.secrets.appSecretName }}
                  key: {{ required "push.secretKeys.identityUri is required" .Values.push.secretKeys.identityUri }}
            {{- end }}

          envFrom:
            - secretRef:
                name: {{ required "secrets.appSecretName is required" .Values.secrets.appSecretName }}

          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}

      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "vaultwarden.fullname" . }}-data
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
