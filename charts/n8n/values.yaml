secrets:
  existingSecret: n8n-secrets-app

nameOverride: n8n
fullnameOverride: n8n

postgres:
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  persistence:
    enabled: true
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    size: 8Gi
  resources:
    requests:
      cpu: 75m
      memory: 192Mi
    limits:
      cpu: 750m
      memory: 768Mi

persistence:
  enabled: true
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  size: 10Gi

traefik:
  ingressRoute:
    enabled: true
    entryPoints:
      - web
    host: n8n.nserbin.com
    serviceName: n8n-main
    servicePort: 5678
    middlewares: []
    tls:
      enabled: false
      secretName: ""

n8n:
  fullnameOverride: n8n

  image:
    repository: docker.n8n.io/n8nio/n8n
    tag: stable
    pullPolicy: IfNotPresent

  queueMode:
    enabled: false

  strategy:
    type: Recreate

  replicaCount: 1

  service:
    type: ClusterIP
    port: 5678

  persistence:
    enabled: true
    existingClaim: n8n-data

  secretRefs:
    existingSecret: n8n-secrets-app

  database:
    type: postgresdb
    useExternal: true
    host: n8n-postgres
    port: 5432
    database: n8n
    schema: public
    user: n8n
    passwordSecret:
      name: n8n-secrets-app
      key: POSTGRES_PASSWORD
    ssl:
      enabled: false

  config:
    timezone: Europe/Lisbon
    extraEnv:
      - name: N8N_DIAGNOSTICS_ENABLED
        value: "false"
      - name: N8N_RUNNERS_ENABLED
        value: "true"
      - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "true"
      - name: N8N_SECURE_COOKIE
        value: "true"
      - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
        value: "false"
      - name: N8N_GIT_NODE_DISABLE_BARE_REPOS
        value: "true"
      - name: N8N_PROXY_HOPS
        value: "1"

  webhook:
    enabled: true
    url: https://n8n.nserbin.com

  ingress:
    enabled: false

  taskRunners:
    enabled: false

  resources:
    main:
      requests:
        cpu: 150m
        memory: 384Mi
      limits:
        cpu: "1"
        memory: 1Gi

  probes:
    liveness:
      enabled: true
      path: /healthz
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 6
    readiness:
      enabled: true
      path: /healthz/readiness
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 9

  serviceAccount:
    create: true
    name: n8n
    automountServiceAccountToken: false

  securityContext:
    enabled: true
    fsGroup: 1000
    runAsUser: 1000
    runAsGroup: 1000

  nodeSelector:
    kubernetes.io/hostname: k3s-worker-3

  tolerations: []
  affinity: {}

