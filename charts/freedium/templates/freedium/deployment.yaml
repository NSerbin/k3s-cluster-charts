apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "freedium.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "freedium.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "freedium.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "freedium.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        {{- if .Values.caddy.enabled }}
        - name: caddy
          image: "{{ .Values.caddy.image.repository }}:{{ .Values.caddy.image.tag }}"
          imagePullPolicy: {{ .Values.caddy.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.caddy.port }}
              name: http
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
        {{- end }}

        - name: freedium
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 7080
              name: app

          envFrom:
            - configMapRef:
                name: {{ include "freedium.fullname" . }}-config
            - secretRef:
                name: {{ .Values.secrets.appExistingSecret }}

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.postgresExistingSecret }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.postgresExistingSecret }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.postgresExistingSecret }}
                  key: POSTGRES_DB
            - name: POSTGRES_HOST
              value: {{ .Values.postgresql.serviceName | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgresql.port | quote }}
            - name: DATABASE_URL
              value: {{ printf "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@%s:%v/$(POSTGRES_DB)" .Values.postgresql.serviceName .Values.postgresql.port | quote }}
            - name: REDIS_HOST
              value: {{ .Values.redis.serviceName | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            - name: REDIS_URL
              value: {{ printf "redis://%s:%v" .Values.redis.serviceName .Values.redis.port | quote }}
            - name: REDIS_SERVICE_HOST
              value: {{ .Values.redis.serviceName | quote }}
            - name: REDIS_SERVICE_PORT
              value: {{ .Values.redis.port | quote }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false

      volumes:
        - name: caddyfile
          configMap:
            name: {{ include "freedium.fullname" . }}-caddy
