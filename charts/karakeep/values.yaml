replicaCount: 1

image:
  repository: ghcr.io/karakeep-app/karakeep
  tag: "release"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

config:
  nextauthUrl: ""
  dataDir: /data
  logLevel: info
  disableNewReleaseCheck: "true"
  dbWalMode: "true"
  rateLimitingEnabled: "true"
  openaiBaseUrl: "https://generativelanguage.googleapis.com/v1beta"
  inferenceTextModel: "gemini-2.5-flash-lite"
  inferenceImageModel: "gemini-2.5-flash-lite"
  extraEnv: {}

crawler:
  allowedInternalHostnames: "."
  numWorkers: "1"
  browserConnectOnDemand: "false"
  downloadBannerImage: "true"
  storeScreenshot: "true"
  fullPageScreenshot: "false"
  screenshotTimeoutSec: "15"
  storePdf: "false"
  fullPageArchive: "false"
  jobTimeoutSec: "180"
  navigateTimeoutSec: "90"
  parseTimeoutSec: "120"
  parserMemLimitMb: "1024"
  videoDownload: "false"
  videoDownloadMaxSize: "50"
  videoDownloadTimeoutSec: "600"
  enableAdblocker: "true"
  monolithTimeoutSec: "20"
  ytdlpArgs: ""
  monolithArgs: ""
  htmlContentSizeInlineThresholdBytes: "5120"

secrets:
  appSecretName: karakeep-secrets-app

persistence:
  enabled: true
  storageClassName: "local-path"
  accessModes:
    - ReadWriteOnce
  size: 10Gi

chrome:
  enabled: true
  image:
    repository: gcr.io/zenika-hub/alpine-chrome
    tag: "124"
    pullPolicy: IfNotPresent
  command:
    - chromium-browser
  service:
    enabled: true
    port: 9222
  extraArgs:
    - --enable-features=ConversionMeasurement,AttributionReportingCrossAppWeb
    - --disable-async-dns
    - --disable-default-apps
    - --disable-extensions
    - --disable-features=UseDnsHttpsSvcb,UseDnsHttpsHttpsSvcb
    - --disable-ipv6
    - --disable-setuid-sandbox
    - --disable-sync
    - --metrics-recording-only
    - --no-first-run
    - --no-zygote
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

meilisearch:
  enabled: true
  image:
    repository: getmeili/meilisearch
    tag: "v1.41.0"
    pullPolicy: IfNotPresent
  service:
    enabled: true
    port: 7700
  persistence:
    enabled: true
    storageClassName: "local-path"
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

traefik:
  ingressRoute:
    enabled: true
    entryPoints:
      - web
    host: "bookmarks.nserbin.com"
    pathPrefixes:
      - "/"
    middlewares: []
    tls:
      enabled: false
      secretName: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
