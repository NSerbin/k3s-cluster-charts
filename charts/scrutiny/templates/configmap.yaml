apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "scrutiny.fullname" . }}-config
  labels:
    {{- include "scrutiny.labels" . | nindent 4 }}
data:
  scrutiny.yaml: |
    version: 1
    web:
      listen:
        host: 0.0.0.0
        port: 8080
      database:
        location: /opt/scrutiny/config/scrutiny.db
      influxdb:
        host: {{ include "scrutiny.fullname" . }}-influxdb
        port: {{ .Values.influxdb.service.port }}
        retention_policy: true
    log:
      level: INFO
