apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "scrutiny.fullname" . }}-config
  labels:
    {{- include "scrutiny.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.web.persistence.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.web.persistence.size | quote }}
