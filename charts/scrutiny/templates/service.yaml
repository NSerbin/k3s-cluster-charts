apiVersion: v1
kind: Service
metadata:
  name: {{ include "scrutiny.fullname" . }}
  labels:
    {{- include "scrutiny.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "scrutiny.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
---
{{- if .Values.collectorService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "scrutiny.fullname" . }}-collector
  labels:
    {{- include "scrutiny.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector-ingress
spec:
  type: {{ .Values.collectorService.type }}
  loadBalancerSourceRanges:
    {{- toYaml .Values.collectorService.loadBalancerSourceRanges | nindent 4 }}
  selector:
    {{- include "scrutiny.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.collectorService.port }}
      targetPort: http
{{- end }}
