external-secrets:
  installCRDs: true

  serviceAccount:
    create: true
    name: external-secrets

vault:
  enabled: true

  namespace: tools

  kubernetesAuth:
    enabled: true
    reviewerServiceAccount:
      create: true
      name: vault-token-reviewer

stores:
  enabled: true
  secretStores: []

  clusterSecretStores:
    - name: vault
      syncWave: 1
      provider:
        vault:
          server: "http://vault.tools.svc.cluster.local:8200"
          path: "kv"
          version: "v2"
          auth:
            kubernetes:
              mountPath: "kubernetes"
              role: "eso-k8s"
              serviceAccountRef:
                name: external-secrets
                namespace: tools


externalSecrets:
  enabled: true
  refreshInterval: 1h
  items:

    - name: cloudflared-secrets
      namespace: traefik
      secretStoreRef:
        name: vault
        kind: ClusterSecretStore
      target:
        name: cloudflared-secrets
        creationPolicy: Owner
        deletionPolicy: Retain
      data:
        - secretKey: credentials.json
          remoteRef:
            key: k8s/core/networking/cloudflare/credentials
            property: 'credentials\.json'
            conversionStrategy: Default
            decodingStrategy: None
            metadataPolicy: None

