external-secrets:
  installCRDs: true

  serviceAccount:
    create: true
    name: external-secrets

stores:
  enabled: true
  secretStores: []

  clusterSecretStores:
    - name: vault
      syncWave: 1
      provider:
        vault:
          server: "http://vault.tools.svc.cluster.local:8200"
          path: "kv"
          version: "v2"
          auth:
            kubernetes:
              mountPath: "kubernetes"
              role: "eso-k8s"
              serviceAccountRef:
                name: external-secrets
                namespace: tools


externalSecrets:
  enabled: true
  refreshInterval: 1h
  items:

    - name: cloudflared-secrets
      namespace: traefik
      secretStoreRef:
        name: vault
        kind: ClusterSecretStore
      target:
        name: cloudflared-secrets
        creationPolicy: Owner
        deletionPolicy: Retain
      data:
        - secretKey: credentials.json
          remoteRef:
            key: k8s/core/networking/cloudflare/credentials

    - name: authentik-secrets
      namespace: tools
      secretStoreRef:
        name: vault
        kind: ClusterSecretStore
      target:
        name: authentik-secrets
        creationPolicy: Owner
        deletionPolicy: Retain
      data:
        - secretKey: POSTGRES_DB
          remoteRef:
            key: k8s/core/security/authentik
            property: POSTGRES_DB
        - secretKey: POSTGRES_USER
          remoteRef:
            key: k8s/core/security/authentik
            property: POSTGRES_USER
        - secretKey: POSTGRES_PASSWORD
          remoteRef:
            key: k8s/core/security/authentik
            property: POSTGRES_PASSWORD
        - secretKey: AUTHENTIK_SECRET_KEY
          remoteRef:
            key: k8s/core/security/authentik
            property: AUTHENTIK_SECRET_KEY

    - name: freshrss-secrets-db
      namespace: tools
      secretStoreRef:
        name: vault
        kind: ClusterSecretStore
      target:
        name: freshrss-secrets-db
        creationPolicy: Owner
        deletionPolicy: Retain
      dataFrom:
        - extract:
            key: k8s/tools/rss/freshrss/db

    - name: freshrss-secrets-oidc
      namespace: tools
      secretStoreRef:
        name: vault
        kind: ClusterSecretStore
      target:
        name: freshrss-secrets-oidc
        creationPolicy: Owner
        deletionPolicy: Retain
      dataFrom:
        - extract:
            key: k8s/tools/rss/freshrss/oidc

    - name: grafana-secrets-admin
      namespace: monitoring
      secretStoreRef:
        name: vault
        kind: ClusterSecretStore
      target:
        name: grafana-secrets-admin
        creationPolicy: Owner
      data:
        - secretKey: admin-password
          remoteRef:
            key: k8s/core/monitoring/grafana/admin
            property: admin-password
        - secretKey: admin-user
          remoteRef:
            key: k8s/core/monitoring/grafana/admin
            property: admin-user

    - name: grafana-secrets-github-app
      namespace: monitoring
      secretStoreRef:
        name: vault
        kind: ClusterSecretStore
      target:
        name: grafana-secrets-github-app
        creationPolicy: Owner
      data:
        - secretKey: GITHUB_APP_ID
          remoteRef:
            key: k8s/core/monitoring/grafana/github-app
            property: GITHUB_APP_ID
        - secretKey: GITHUB_APP_INSTALLATION_ID
          remoteRef:
            key: k8s/core/monitoring/grafana/github-app
            property: GITHUB_APP_INSTALLATION_ID
        - secretKey: GITHUB_APP_PRIVATE_KEY
          remoteRef:
            key: k8s/core/monitoring/grafana/github-app
            property: GITHUB_APP_PRIVATE_KEY

    - name: grafana-secrets-github-oidc
      namespace: monitoring
      secretStoreRef:
        name: vault
        kind: ClusterSecretStore
      target:
        name: grafana-secrets-github-oidc
        creationPolicy: Owner
      data:
        - secretKey: GF_AUTH_GITHUB_CLIENT_ID
          remoteRef:
            key: k8s/core/monitoring/grafana/github-oidc
            property: GF_AUTH_GITHUB_CLIENT_ID
        - secretKey: GF_AUTH_GITHUB_CLIENT_SECRET
          remoteRef:
            key: k8s/core/monitoring/grafana/github-oidc
            property: GF_AUTH_GITHUB_CLIENT_SECRET


    - name: grafana-secrets-oidc
      namespace: tools
      secretStoreRef:
        name: vault
        kind: ClusterSecretStore
      target:
        name: grafana-secrets-oidc
        creationPolicy: Owner
        deletionPolicy: Retain
      data:
        - secretKey: AUTHENTIK_API_URL
          remoteRef:
            key: k8s/core/monitoring/grafana/oidc
            property: AUTHENTIK_API_URL
        - secretKey: AUTHENTIK_AUTH_URL
          remoteRef:
            key: k8s/core/monitoring/grafana/oidc
            property: AUTHENTIK_AUTH_URL
        - secretKey: AUTHENTIK_TOKEN_URL
          remoteRef:
            key: k8s/core/monitoring/grafana/oidc
            property: AUTHENTIK_TOKEN_URL
        - secretKey: AUTHENTIK_CLIENT_ID
          remoteRef:
            key: k8s/core/monitoring/grafana/oidc
            property: AUTHENTIK_CLIENT_ID
        - secretKey: AUTHENTIK_CLIENT_SECRET
          remoteRef:
            key: k8s/core/monitoring/grafana/oidc
            property: AUTHENTIK_CLIENT_SECRET
        - secretKey: AUTHENTIK_SIGNOUT_REDIRECT_URL
          remoteRef:
            key: k8s/core/monitoring/grafana/oidc
            property: AUTHENTIK_SIGNOUT_REDIRECT_URL

    - name: alertmanager-secrets-notifications
      namespace: tools
      secretStoreRef:
        name: vault
        kind: ClusterSecretStore
      target:
        name: alertmanager-secrets-notifications
        creationPolicy: Owner
        deletionPolicy: Retain
      data:
        - secretKey: SLACK_WEBHOOK_URL
          remoteRef:
            key: k8s/core/monitoring/alertmanager/notifications
            property: SLACK_WEBHOOK_URL
        - secretKey: SLACK_CHANNEL
          remoteRef:
            key: k8s/core/monitoring/alertmanager/notifications
            property: SLACK_CHANNEL

    - name: monitoring-secrets-shared
      namespace: tools
      secretStoreRef:
        name: vault
        kind: ClusterSecretStore
      target:
        name: monitoring-secrets-shared
        creationPolicy: Owner
        deletionPolicy: Retain
      data:
        - secretKey: GRAFANA_HTTP
          remoteRef:
            key: k8s/core/monitoring/shared
            property: GRAFANA_HTTP
        - secretKey: GRAFANA_HTTPS
          remoteRef:
            key: k8s/core/monitoring/shared
            property: GRAFANA_HTTPS
        - secretKey: PROMETHEUS_HTTP
          remoteRef:
            key: k8s/core/monitoring/shared
            property: PROMETHEUS_HTTP
        - secretKey: PROMETHEUS_HTTPS
          remoteRef:
            key: k8s/core/monitoring/shared
            property: PROMETHEUS_HTTPS
        - secretKey: ALERTMANAGER_HTTP
          remoteRef:
            key: k8s/core/monitoring/shared
            property: ALERTMANAGER_HTTP
        - secretKey: ALERTMANAGER_HTTPS
          remoteRef:
            key: k8s/core/monitoring/shared
            property: ALERTMANAGER_HTTPS