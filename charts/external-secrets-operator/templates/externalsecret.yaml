{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.items }}
{{- range .Values.externalSecrets.items }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace | default "tools" }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: {{ .refreshInterval | default $.Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .secretStoreRef.name }}
    kind: {{ .secretStoreRef.kind | default "SecretStore" }}
  target:
    name: {{ .target.name | default .name }}
    creationPolicy: {{ .target.creationPolicy | default "Owner" }}
{{- if .target.template }}
    template:
{{- toYaml .target.template | nindent 6 }}
{{- end }}
{{- if .dataFrom }}
  dataFrom:
{{- toYaml .dataFrom | nindent 4 }}
{{- end }}
{{- if .data }}
  data:
{{- toYaml .data | nindent 4 }}
{{- end }}
---
{{- end }}
{{- end }}
