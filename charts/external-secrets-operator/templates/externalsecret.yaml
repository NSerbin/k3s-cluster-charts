{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.items }}
{{- range .Values.externalSecrets.items }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace | default "tools" }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: {{ .syncWave | default 2 | quote }}
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  refreshInterval: {{ .refreshInterval | default $.Values.externalSecrets.refreshInterval | default "1h" }}

  secretStoreRef:
    name: {{ .secretStoreRef.name }}
    kind: {{ .secretStoreRef.kind | default "ClusterSecretStore" }}

  target:
    name: {{ .target.name | default .name }}
    creationPolicy: {{ .target.creationPolicy | default "Owner" }}
    deletionPolicy: {{ .target.deletionPolicy | default "Retain" }}

{{- if .target.template }}
    template:
{{ toYaml .target.template | nindent 6 }}
{{- end }}

{{- if .dataFrom }}
  dataFrom:
{{- range .dataFrom }}
    - {{- if .extract }}
      {{- $extract := deepCopy .extract }}
      {{- if not (hasKey $extract "nullBytePolicy") }}
      {{- $_ := set $extract "nullBytePolicy" "Ignore" }}
      {{- end }}
      extract:
{{- toYaml $extract | nindent 8 }}
      {{- else }}
{{- toYaml . | nindent 6 }}
      {{- end }}
{{- end }}
{{- end }}

{{- if .data }}
  data:
{{- range .data }}
    - secretKey: {{ .secretKey }}
      {{- if .remoteRef }}
      {{- $remoteRef := deepCopy .remoteRef }}
      {{- if not (hasKey $remoteRef "nullBytePolicy") }}
      {{- $_ := set $remoteRef "nullBytePolicy" "Ignore" }}
      {{- end }}
      remoteRef:
{{- toYaml $remoteRef | nindent 8 }}
      {{- else }}
{{- omit . "secretKey" | toYaml | nindent 6 }}
      {{- end }}
{{- end }}
{{- end }}
---
{{- end }}
{{- end }}
