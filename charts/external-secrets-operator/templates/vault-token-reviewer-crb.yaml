{{- if and .Values.vault.enabled .Values.vault.kubernetesAuth.enabled .Values.vault.kubernetesAuth.reviewerServiceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-token-reviewer" (.Values.vault.kubernetesAuth.reviewerServiceAccount.name) | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ .Values.vault.kubernetesAuth.reviewerServiceAccount.name | quote }}
    namespace: {{ .Values.vault.namespace | quote }}
{{- end }}
