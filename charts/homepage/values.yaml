    - Media:
        - BentoPDF:
            icon: mdi-file-pdf-box
            href: https://pdf.nserbin.com/
            siteMonitor: http://bentopdf:8080
            description: PDF Tools
            server: k3s

        - Excalidraw:
            icon: mdi-draw
