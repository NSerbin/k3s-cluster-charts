        - Paperless-ngx:
            icon: paperless-ngx.svg
            href: https://paperless.nserbin.com/
            siteMonitor: http://paperless-ngx/
            description: Document archive
            server: k3s
            widget:
              type: paperlessngx
              url: http://paperless-ngx
              username: {{HOMEPAGE_VAR_PAPERLESS_USERNAME}}
              password: {{HOMEPAGE_VAR_PAPERLESS_PASSWORD}}

    - Developer Tools:
        - GitGuardian:
            icon: mdi-shield-bug
            href: https://dashboard.gitguardian.com/
            description: Repository secret scanning

        - GitHub:
            icon: github-light.png
            href: https://github.com/Nserbin
            description: Github Repository

        - GitLab:
            icon: gitlab.png
            href: https://gitlab.com/
            description: Gitlab Repository

        - LibreDB Studio:
            icon: mdi-database-search
            href: https://libredb.nserbin.com/
            siteMonitor: http://libredb-studio/
            description: Database cockpit
            server: k3s

    - AI:
        - ChatGPT:
            icon: https://api.iconify.design/simple-icons/openai.svg?color=%23ffffff
            href: https://chat.openai.com/
            description: ChatGPT

        - Gemini:
            icon: si-googlebard
            href: https://gemini.google.com/
            description: Gemini

        - OpenRouter:
            icon: si-openrouter
            href: https://openrouter.ai/
            description: AI model gateway

    - Web Tools:
        - Cal.diy:
            icon: mdi-calendar-clock
            href: https://calendar.nserbin.com/
            siteMonitor: http://cal-diy/
            description: Scheduling
            server: k3s

        - IT Tools:
            icon: it-tools.svg
            href: https://tools.nserbin.com/
            siteMonitor: http://it-tools:8080/
            description: Multiple Tools
            server: k3s

        - Karakeep:
            icon: mdi-bookmark-multiple
            href: https://bookmarks.nserbin.com/
            siteMonitor: http://karakeep-karakeep:3000
            description: Bookmarks
            server: k3s
            widget:
              type: karakeep
              url: http://karakeep-karakeep:3000
