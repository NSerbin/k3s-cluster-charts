replicaCount: 1

image:
  repository: ghcr.io/gethomepage/homepage
  tag: "v2.1.2"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: "homepage"

serviceAccount:
  create: true
  name: ""
  automount: true

rbac:
  create: true

service:
  type: ClusterIP
  port: 3000

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

env:
  HOMEPAGE_ALLOWED_HOSTS: "*"
  HOMEPAGE_AUTH_ENABLED: "true"
  HOMEPAGE_EXTERNAL_URL: "https://home.nserbin.com"
  HOMEPAGE_OIDC_ISSUER: "https://auth.nserbin.com/application/o/homepage/"
  HOMEPAGE_OIDC_NAME: "Authentik"
  HOMEPAGE_OIDC_SCOPE: "openid email profile"
  NODE_OPTIONS: "--dns-result-order=ipv4first"

secrets:
  existingSecret: homepage-secrets-app

config:
  existingConfigMap: ""

  kubernetesYaml: |
    mode: cluster
    traefik: true

  settingsYaml: |
    title: My Homepage Dashboard
    theme: dark
    iconStyle: theme
    color: slate
    language: en

    headerStyle: underlined



    logpath: /app/config/logs

    base: https://home.nserbin.com/

    hideErrors: false
    useEqualHeights: true

    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: true
      hideVisitURL: true

    target: _blank
    showStats: true

    layout:
      # RPi-only category. Kept here to restore quickly if needed.
      # Management:
      #   icon: mdi-view-dashboard
      Monitoring:
        icon: mdi-monitor-eye
      Networking:
        icon: mdi-wan
      News:
        icon: mdi-newspaper
      Security:
        icon: mdi-security
      Secrets:
        icon: mdi-shield-key
      Finance:
        icon: mdi-cash-multiple
      AI:
        icon: mdi-creation
      Knowledge:
        icon: mdi-school
      Travel:
        icon: mdi-airplane
      Media Tools:
        icon: mdi-multimedia
      Developer Tools:
        icon: mdi-tools
      Cluster:
        icon: mdi-kubernetes

  bookmarksYaml: |
    - Courses:
        - Udemy:
            - icon: udemy.png
              abbr: U
              href: https://www.udemy.com/
              description: Udemy
        - TutorialsDojo:
            - icon: ""
              abbr: TD
              href: https://tutorialsdojo.com/
              description: Tutorials Dojo

    - Entertainment:
        - Amazon Music:
            - icon: amazon-light.png
              abbr: AMM
              href: https://music.amazon.com
              description: Amazon Music
        - YouTube:
            - icon: youtube.png
              abbr: YT
              href: https://youtube.com/
              description: YouTube
        - SoundCloud:
            - icon: mdi-soundcloud
              abbr: SC
              href: https://soundcloud.com
              description: SoundCloud
        - Netflix:
            - icon: netflix.png
              abbr: NF
              href: https://netflix.com
              description: Netflix

    - Marketplace:
        - Amazon:
            - icon: amazon-light.png
              abbr: AM
              href: https://amazon.es
              description: Amazon
        - Hagglezone:
            - icon: 
              abbr: HG
              href: https://www.hagglezon.com/
              description: Hagglezon
        - OLX:
            - icon: 
              abbr: OLX
              href: https://olx.pt
              description: SoundCloud
        - Vinted:
            - icon: 
              abbr: V
              href: https://vinted.pt
              description: Vinted

  servicesYaml: |
    - Cluster:
        - Argo CD:
            href: https://argo.nserbin.com
            siteMonitor: http://argocd-server.argocd/api/version
            description: GitOps
            server: k3s
            icon: si-argo.svg
            widget:
              type: argocd
              url: http://argocd-server.argocd/
              key: {{HOMEPAGE_VAR_ARGOCD_KEY}}

    - Monitoring:
        # RPi service. Kept here to restore quickly if needed.
        # - cAdvisor:
        #     icon: cadvisor.png
        #     href: https://cadvisor.nserbin.com
        #     siteMonitor: http://192.168.0.4:8080
        #     description: cAdvisor Dashboard
        #     server: rpi

        - Grafana:
            icon: grafana.png
            href: https://monitor.nserbin.com
            siteMonitor: http://kube-prometheus-stack-grafana.monitoring/api/health
            description: Grafana
            server: k3s
            widget:
              type: grafana
              version: 2
              alerts: alertmanager
              url: http://kube-prometheus-stack-grafana.monitoring
              username: {{HOMEPAGE_VAR_GRAFANA_USERNAME}}
              password: {{HOMEPAGE_VAR_GRAFANA_PASSWORD}}

        - Prometheus:
            icon: prometheus.png
            href: https://prometheus.nserbin.com
            siteMonitor: http://kube-prometheus-stack-prometheus.monitoring:9090/-/healthy
            description: Prometheus
            server: k3s
            widget:
              type: prometheus
              url: http://kube-prometheus-stack-prometheus.monitoring:9090

        - Alertmanager:
            icon: alertmanager.png
            href: https://alerts.nserbin.com
            siteMonitor: http://kube-prometheus-stack-alertmanager.monitoring:9093/-/healthy
            description: Alertmanager
            server: k3s

        # RPi service. Kept here to restore quickly if needed.
        # - Uptime Kuma:
        #     icon: uptime-kuma.png
        #     href: https://status.nserbin.com/
        #     siteMonitor: http://192.168.0.4:3001
        #     description: Status dashboard for all the services
        #     server: rpi
        #     widget:
        #       type: uptimekuma
        #       url: http://192.168.0.4:3001/
        #       slug: default

    - News:
        - FreshRSS:
            icon: freshrss.svg
            href: http://rss.nserbin.com
            description: Fresh RSS
            server: k3s
            siteMonitor: http://freshrss-freshrss.tools/
            widget:
              type: freshrss
              url: http://freshrss-freshrss.tools/
              username: {{HOMEPAGE_VAR_FRESHRSS_USERNAME}}
              password: {{HOMEPAGE_VAR_FRESHRSS_PASSWORD}}

        - Freedium:
            icon: mdi-web-sync
            href: http://free.nserbin.com
            description: Freedium Web Fork
            server: k3s
            siteMonitor: http://freedium-web/

        - Reddit:
            icon: reddit.png
            href: https://reddit.com/
            description: Reddit

    - Networking:
        # RPi service. Kept here to restore quickly if needed.
        # - Pi-hole:
        #     icon: pi-hole.svg
        #     href: https://pihole.nserbin.com/admin
        #     siteMonitor: http://192.168.0.4:83
        #     description: Pi-hole DNS
        #     server: rpi
        #     widget:
        #       type: pihole
        #       url: http://192.168.0.4:83
        #       version: 6
        #       key: {{HOMEPAGE_VAR_PIHOLE_KEY}}
              
        - Traefik:
            icon: traefik.svg
            href: https://traefik.nserbin.com/dashboard/
            siteMonitor: http://traefik.traefik:9000/ping
            description: Traefik
            server: k3s
            widget:
              type: traefik
              url: http://traefik.traefik:9000
        
        # RPi service. Kept here to restore quickly if needed.
        # - RPI Cloudflare Tunnel:
        #     icon: cloudflare.svg
        #     href: https://cloudflare.com
        #     description: Cloudflare
        #     widget:
        #       type: cloudflared
        #       accountid: {{HOMEPAGE_VAR_CLOUDFLARE_ACCOUNT}}
        #       tunnelid: {{HOMEPAGE_VAR_CLOUDFLARE_RPI_TUNNEL_ID}}
        #       key: {{HOMEPAGE_VAR_CLOUDFLARE_TOKEN}}

        - k3s Cloudflare Tunnel:
            icon: cloudflare.svg
            href: https://cloudflare.com
            description: Cloudflare
            widget:            
              type: cloudflared
              accountid: {{HOMEPAGE_VAR_CLOUDFLARE_ACCOUNT}}
              tunnelid: {{HOMEPAGE_VAR_CLOUDFLARE_K3S_TUNNEL_ID}}
              key: {{HOMEPAGE_VAR_CLOUDFLARE_TOKEN}}

    # RPi-only category. Kept here to restore quickly if needed.
    # - Management:
    #     - Portainer:
    #         icon: portainer.svg
    #         href: https://portainer.nserbin.com/
    #         siteMonitor: http://192.168.0.4:9000/
    #         description: Portainer
    #         server: rpi
    #         widget:
    #           type: portainer
    #           url: http://192.168.0.4:9000/
    #           env: 1
    #           kubernetes: false
    #           key: {{HOMEPAGE_VAR_PORTAINER_KEY}}

    - Media Tools:
        - BentoPDF:
            icon: mdi-file-pdf-box
            href: https://pdf.nserbin.com/
            siteMonitor: http://bentopdf:8080
            description: PDF Tools
            server: k3s

    - Developer Tools:
        - IT Tools:
            icon: it-tools.svg
            href: https://tools.nserbin.com/
            siteMonitor: http://it-tools:8080/
            description: Multiple Tools
            server: k3s

        - LibreDB Studio:
            icon: mdi-database-search
            href: https://libredb.nserbin.com/
            siteMonitor: http://libredb-studio/
            description: Database cockpit
            server: k3s

        - GitHub:
            icon: github-light.png
            href: https://github.com/Nserbin
            description: Github Repository

        - GitLab:
            icon: gitlab.png
            href: https://gitlab.com/
            description: Gitlab Repository

        - GitGuardian:
            icon: mdi-shield-bug
            href: https://dashboard.gitguardian.com/
            description: Repository secret scanning

    - AI:
        - MCP Gateway:
            icon: mdi-hub
            href: https://mcp.nserbin.com/
            siteMonitor: http://mcp-gateway/
            description: ContextForge
            server: k3s

        - ChatGPT:
            icon: chatgpt.svg
            href: https://chat.openai.com/
            description: ChatGPT

        - Gemini:
            icon: si-googlebard
            href: https://gemini.google.com/
            description: Gemini

    - Knowledge:
        - Karakeep:
            icon: mdi-bookmark-multiple
            href: https://bookmarks.nserbin.com/
            siteMonitor: http://karakeep-karakeep:3000
            description: Bookmarks
            server: k3s
            widget:
              type: karakeep
              url: http://karakeep-karakeep:3000
              key: {{HOMEPAGE_VAR_KARAKEEP_APIKEY}}

        - AppFlowy:
            icon: appflowy.svg
            href: https://wiki.nserbin.com/
            siteMonitor: http://appflowy-web/
            description: Notes and workspace
            server: k3s

        - Excalidraw:
            icon: mdi-draw
            href: https://whiteboard.nserbin.com/
            siteMonitor: http://excalidraw/
            description: Whiteboard
            server: k3s

        - Paperless-ngx:
            icon: paperless-ngx.svg
            href: https://paperless.nserbin.com/
            siteMonitor: http://paperless-ngx/
            description: Document archive
            server: k3s

    - Travel:
        - TREK:
            icon: mdi-map-marker-path
            href: https://travels.nserbin.com/
            siteMonitor: http://trek:3000/api/health
            description: Travel planning
            server: k3s

        # RPi service. Kept here to restore quickly if needed.
        # - SSH:
        #     icon: shell.svg
        #     href: https://ssh-tunnel.nserbin.com/
        #     description: SSH Tunnel to RPi
        #     server: rpi

    - Secrets:
        # Legacy RPi FileBrowser entry. Kept here to restore quickly if needed.
        # - FileBrowser:
        #     icon: filebrowser.png
        #     href: https://secrets.nserbin.com/
        #     siteMonitor: http://192.168.0.4:8082
        #     description: FileBrowser
        #     server: rpi
        #     widget:
        #       type: filebrowser
        #       url: http://192.168.0.4:8082
        #       username: {{HOMEPAGE_VAR_FILEBROWSER_USERNAME}}
        #       password: {{HOMEPAGE_VAR_FILEBROWSER_PASSWORD}}

        - Vault:
            icon: vault.svg
            href: https://secrets.nserbin.com/
            siteMonitor: http://vault-ui:8200/v1/sys/health?standbyok=true
            description: Secrets management
            server: k3s

        - Share:
            icon: mdi-share-variant
            href: https://share.nserbin.com/
            siteMonitor: http://yopass:1337/
            description: Secure secret sharing
            server: k3s

    - Finance:
        - Sure:
            icon: mdi-cash-multiple
            href: https://money.nserbin.com/
            siteMonitor: http://sure/up
            description: Personal finance
            server: k3s

    - Security:
        - Authentik:
            icon: authentik.svg
            href: https://auth.nserbin.com
            description: Authentik
            server: k3s
            siteMonitor: http://authentik-server.tools:9000/-/health/live/
            widget:
              type: authentik
              url: http://authentik-server.tools:9000
              key: {{HOMEPAGE_VAR_AUTHENTIK_KEY}}
              version: 2 

        - Bitwarden:
            icon: bitwarden.svg
            href: https://btw.nserbin.com
            siteMonitor: http://vaultwarden-vaultwarden.tools/
            description: Bitwarden
            server: k3s

  widgetsYaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

    - resources:
        label: Uptime
        uptime: true

    - datetime:
        text_size: l
        locale: es
        format:
          timeStyle: short
          hourCycle: h23
          dateStyle: short

    - search:
        provider: duckduckgo
        target: _blank

  dockerYaml: ""
  customCss: ""
  customJs: ""

persistence:
  logs:
    enabled: false
    size: 1Gi
    storageClassName: ""

traefik:
  ingressRoute:
    enabled: true
    entryPoints:
      - web
    host: "home.nserbin.com"
    tls:
      enabled: true
      secretName: ""
    stickySessions:
      enabled: false
      cookie:
        name: "homepage_sticky"
        secure: true
        httpOnly: true
        sameSite: "none"

dnsPolicy: ClusterFirst
dnsConfig:
  options:
    - name: ndots
      value: "2"
#     - name: single-request-reopen
#       value: ""
