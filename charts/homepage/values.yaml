replicaCount: 1

image:
  repository: ghcr.io/gethomepage/homepage
  tag: "v2.7.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: "homepage"

serviceAccount:
  create: true
  name: ""
  automount: true

rbac:
  create: true

service:
  type: ClusterIP
  port: 3000

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

env:
  HOMEPAGE_ALLOWED_HOSTS: "*"
  HOMEPAGE_AUTH_ENABLED: "true"
  HOMEPAGE_EXTERNAL_URL: "https://home.nserbin.com"
  HOMEPAGE_OIDC_ISSUER: "https://auth.nserbin.com/application/o/homepage/"
  HOMEPAGE_OIDC_NAME: "Authentik"
  HOMEPAGE_OIDC_SCOPE: "openid email profile"
  NODE_OPTIONS: "--dns-result-order=ipv4first"

secrets:
  existingSecret: homepage-secrets-app

config:
  existingConfigMap: ""

  kubernetesYaml: |
    mode: cluster
    traefik: true

  settingsYaml: |
    title: Nserbin Home
    theme: dark
    iconStyle: theme
    color: slate
    language: en

    headerStyle: clean
    cardStyle: hairline
    blockStyle: refined
    font: plexData

    logpath: /app/config/logs

    base: https://home.nserbin.com/

    hideErrors: false
    useEqualHeights: true

    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: true
      hideVisitURL: true

    target: _blank
    showStats: true

    layout:
      AI:
        icon: mdi-creation
        tab: Workspace
        style: row
        columns: 3
      Automation:
        icon: mdi-robot-outline
        tab: Workspace
        style: row
        columns: 3
      Developer Tools:
        icon: mdi-tools
        tab: Workspace
        style: row
        columns: 3
      Knowledge:
        icon: mdi-school
        tab: Workspace
        style: row
        columns: 3
      Web Tools:
        icon: mdi-web
        tab: Workspace
        style: row
        columns: 3
      Cluster:
        icon: mdi-kubernetes
        tab: Infrastructure
        style: row
        columns: 3
      Monitoring:
        icon: mdi-monitor-eye
        tab: Infrastructure
        style: row
        columns: 3
      Networking:
        icon: mdi-wan
        tab: Infrastructure
        style: row
        columns: 3
      Secrets:
        icon: mdi-shield-key
        tab: Infrastructure
        style: row
        columns: 3
      Security:
        icon: mdi-security
        tab: Infrastructure
        style: row
        columns: 3
      Finance:
        icon: mdi-cash-multiple
        tab: Personal
        style: row
        columns: 3
      Media:
        icon: mdi-multimedia
        tab: Personal
        style: row
        columns: 3
      News:
        icon: mdi-newspaper
        tab: Personal
        style: row
        columns: 3
      Travel:
        icon: mdi-airplane
        tab: Personal
        style: row
        columns: 3
      Courses:
        icon: mdi-school-outline
        tab: Links
        style: row
        columns: 3
      Entertainment:
        icon: mdi-play-circle-outline
        tab: Links
        style: row
        columns: 3
      Marketplace:
        icon: mdi-shopping-outline
        tab: Links
        style: row
        columns: 3

  bookmarksYaml: |
    - Courses:
        - TutorialsDojo:
            - icon: https://api.iconify.design/mdi/school-outline.svg?color=%23ffffff
              abbr: TD
              href: https://tutorialsdojo.com/
              description: Tutorials Dojo
        - Udemy:
            - icon: https://cdn.simpleicons.org/udemy/ffffff
              abbr: U
              href: https://www.udemy.com/
              description: Udemy

    - Entertainment:
        - Amazon Music:
            - icon: amazon-light.png
              abbr: AMM
              href: https://music.amazon.com
              description: Amazon Music
        - Netflix:
            - icon: netflix.png
              abbr: NF
              href: https://netflix.com
              description: Netflix
        - SoundCloud:
            - icon: mdi-soundcloud
              abbr: SC
              href: https://soundcloud.com
              description: SoundCloud
        - YouTube:
            - icon: https://cdn.simpleicons.org/youtube/ffffff
              abbr: YT
              href: https://youtube.com/
              description: YouTube

    - Marketplace:
        - Amazon:
            - icon: amazon-light.png
              abbr: AM
              href: https://amazon.es
              description: Amazon
        - Hagglezone:
            - icon: https://api.iconify.design/mdi/tag-search-outline.svg?color=%23ffffff
              abbr: HG
              href: https://www.hagglezon.com/
              description: Hagglezon
        - OLX:
            - icon: https://api.iconify.design/arcticons/olx.svg?color=%23ffffff
              abbr: OLX
              href: https://olx.pt
              description: Classifieds marketplace
        - Vinted:
            - icon: https://cdn.simpleicons.org/vinted/ffffff
              abbr: V
              href: https://vinted.pt
              description: Vinted

  servicesYaml: |
    - Cluster:
        - Argo CD:
            href: https://argo.nserbin.com
            siteMonitor: http://argocd-server.argocd/api/version
            description: GitOps
            server: k3s
            icon: si-argo.svg
            widget:
              type: argocd
              url: http://argocd-server.argocd/
              key: {{HOMEPAGE_VAR_ARGOCD_KEY}}

    - Monitoring:
        # RPi service. Kept here to restore quickly if needed.
        # - cAdvisor:
        #     icon: cadvisor.png
        #     href: https://cadvisor.nserbin.com
        #     siteMonitor: http://192.168.0.4:8080
        #     description: cAdvisor Dashboard
        #     server: rpi

        - Alertmanager:
            icon: alertmanager.png
            href: https://alerts.nserbin.com
            siteMonitor: http://kube-prometheus-stack-alertmanager.monitoring:9093/-/healthy
            description: Alertmanager
            server: k3s

        - Grafana:
            icon: grafana.png
            href: https://monitor.nserbin.com
            siteMonitor: http://kube-prometheus-stack-grafana.monitoring/api/health
            description: Grafana
            server: k3s
            widget:
              type: grafana
              version: 2
              alerts: alertmanager
              url: http://kube-prometheus-stack-grafana.monitoring
              username: {{HOMEPAGE_VAR_GRAFANA_USERNAME}}
              password: {{HOMEPAGE_VAR_GRAFANA_PASSWORD}}

        - Prometheus:
            icon: prometheus.png
            href: https://prometheus.nserbin.com
            siteMonitor: http://kube-prometheus-stack-prometheus.monitoring:9090/-/healthy
            description: Prometheus
            server: k3s
            widget:
              type: prometheus
              url: http://kube-prometheus-stack-prometheus.monitoring:9090

        - Scrutiny:
            icon: mdi-harddisk
            href: https://disks.nserbin.com
            siteMonitor: http://scrutiny.tools:8080/api/health
            description: Proxmox SMART disk health
            server: k3s
            widget:
              type: scrutiny
              url: http://scrutiny.tools:8080

        # RPi service. Kept here to restore quickly if needed.
        # - Uptime Kuma:
        #     icon: uptime-kuma.png
        #     href: https://status.nserbin.com/
        #     siteMonitor: http://192.168.0.4:3001
