    - News:
        - Freedium:
            icon: mdi-web-sync
            href: http://free.nserbin.com
            description: Freedium Web Fork
            server: k3s
            siteMonitor: http://freedium-web/

        - FreshRSS:
            icon: freshrss.svg
            href: http://rss.nserbin.com
            description: Fresh RSS
            server: k3s
            siteMonitor: http://freshrss-freshrss.tools/
            widget:
              type: freshrss
              url: http://freshrss-freshrss.tools/
              username: {{HOMEPAGE_VAR_FRESHRSS_USERNAME}}
              password: {{HOMEPAGE_VAR_FRESHRSS_PASSWORD}}

        - Reddit:
            icon: https://cdn.simpleicons.org/reddit/ffffff
            href: https://reddit.com/
            description: Reddit

    - Networking:
        - AdGuard Home:
            icon: https://cdn.simpleicons.org/adguard/ffffff
            href: https://adguard.nserbin.com
            siteMonitor: http://adguard-home.tools:80
            description: Private DNS filtering
            server: k3s

        # RPi service. Kept here to restore quickly if needed.
        # - Pi-hole:
        #     icon: pi-hole.svg
        #     href: https://pihole.nserbin.com/admin
        #     siteMonitor: http://192.168.0.4:83
        #     description: Pi-hole DNS
