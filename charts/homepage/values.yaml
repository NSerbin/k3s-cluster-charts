        - Bitwarden:
            icon: https://cdn.simpleicons.org/bitwarden/ffffff
            href: https://btw.nserbin.com
            siteMonitor: http://vaultwarden-vaultwarden.tools/
            description: Bitwarden
            server: k3s

        - Share:
            icon: mdi-share-variant
            href: https://share.nserbin.com/
            siteMonitor: http://yopass:1337/
            description: Secure secret sharing
            server: k3s

        - Vault:
            icon: https://cdn.simpleicons.org/vault/ffffff
            href: https://secrets.nserbin.com/
            siteMonitor: http://vault-ui:8200/v1/sys/health?standbyok=true
            description: Secrets management
            server: k3s

    - Finance:
        - Sure:
            icon: mdi-cash-multiple
            href: https://money.nserbin.com/
            siteMonitor: http://sure/up
            description: Personal finance
            server: k3s

    - Security:
        - Authentik:
            icon: authentik.svg
            href: https://auth.nserbin.com
            description: Authentik
            server: k3s
            siteMonitor: http://authentik-server.tools:9000/-/health/live/
            widget:
              type: authentik
              url: http://authentik-server.tools:9000
              key: {{HOMEPAGE_VAR_AUTHENTIK_KEY}}
              version: 2 

  widgetsYaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

    - datetime:
        text_size: l
        locale: es
        format:
          timeStyle: short
          hourCycle: h23
          dateStyle: short

    - search:
        provider: duckduckgo
        target: _blank

  dockerYaml: ""
  customCss: |
    .service-icon img,
    .bookmark-icon img {
      filter: grayscale(1) brightness(0) invert(1);
    }

    #layout-groups > .services-group {
      margin-bottom: 1.25rem;
    }

    @media (min-width: 768px) {
      #layout-groups > .services-group {
        flex: 0 0 50% !important;
        max-width: 50%;
      }
    }

    #layout-groups > .bookmark-group {
      flex: 0 0 100% !important;
      max-width: 100%;
      margin-bottom: 1.25rem;
    }

    .bookmark-text {
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      overflow: visible;
      padding: 0.45rem 0.75rem;
    }

    .bookmark-name {
      padding: 0;
    }

    .bookmark-description {
      flex-shrink: 1;
      overflow: visible;
      padding: 0.125rem 0 0;
      text-overflow: clip;
      white-space: normal;
    }

    #widgets-wrap {
      flex-direction: column;
      gap: 0.75rem;
    }

    .information-widget-kubernetes {
      order: 2;
      width: 100%;
      padding: 0.25rem 0.75rem;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 0.5rem;
      background: rgba(255, 255, 255, 0.035);
    }

    #information-widgets-right {
      order: 1;
      display: grid;
      grid-template-areas:
        "search datetime";
      grid-template-columns: minmax(16rem, 1fr) auto;
      width: 100%;
      margin: 0;
      padding: 0.5rem 0.75rem;
      gap: 0.35rem 1rem;
      align-items: center;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 0.5rem;
      background: rgba(255, 255, 255, 0.035);
    }

    #information-widgets-right .information-widget-datetime {
      grid-area: datetime;
    }

    #information-widgets-right .information-widget-search {
      grid-area: search;
      min-width: 0;
    }

    #information-widgets-right .information-widget-search > div {
      margin-top: 0.25rem;
      margin-bottom: 0.25rem;
    }

    @media (max-width: 640px) {
      #information-widgets-right {
        grid-template-areas:
          "search"
          "datetime";
        grid-template-columns: 1fr;
      }
    }
  customJs: ""

persistence:
  logs:
    enabled: false
    size: 1Gi
    storageClassName: ""

traefik:
  ingressRoute:
    enabled: true
    entryPoints:
      - web
    host: "home.nserbin.com"
    tls:
      enabled: true
      secretName: ""
    stickySessions:
      enabled: false
      cookie:
        name: "homepage_sticky"
        secure: true
        httpOnly: true
        sameSite: "none"

dnsPolicy: ClusterFirst
dnsConfig:
  options:
    - name: ndots
      value: "2"
#     - name: single-request-reopen
#       value: ""
