    - Secrets:
        # Legacy RPi FileBrowser entry. Kept here to restore quickly if needed.
        # - FileBrowser:
        #     icon: filebrowser.png
        #     href: https://secrets.nserbin.com/
        #     siteMonitor: http://192.168.0.4:8082
        #     description: FileBrowser
