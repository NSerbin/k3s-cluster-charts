replicaCount: 1

image:
  repository: linkstackorg/linkstack
  tag: "v4.8.8"
  pullPolicy: IfNotPresent

waitImage:
  repository: busybox
  tag: "1.37.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

persistence:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  size: 2Gi

secrets:
  dbSecretName: linkstack-secrets-db
  vaultPath: k8s/tools/web/linkstack/db

mysql:
  image:
    repository: mysql
    tag: "8.4"
    pullPolicy: IfNotPresent
  service:
    port: 3306
  persistence:
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    size: 2Gi
  resources:
    requests:
      cpu: 75m
      memory: 256Mi
    limits:
      cpu: 750m
      memory: 768Mi
  nodeSelector:
    kubernetes.io/hostname: k3s-worker-4

config:
  timezone: Europe/Lisbon
  serverAdmin: nicolas.serbin@gmail.com
  publicHost: bio.nserbin.com
  adminHost: bio-admin.nserbin.com
  phpMemoryLimit: 256M
  uploadMaxFilesize: 16M

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

traefik:
  entryPoints:
    - web

nodeSelector:
  workload.nserbin.com/general: "true"

tolerations: []
affinity: {}
