apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "linkstack.fullname" . }}
  labels:
    {{- include "linkstack.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- range .Values.traefik.entryPoints }}
    - {{ . | quote }}
    {{- end }}
  routes:
    - match: Host(`{{ .Values.config.publicHost }}`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: {{ include "linkstack.fullname" . }}
          port: {{ .Values.service.port }}
    - match: Host(`{{ .Values.config.adminHost }}`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: {{ include "linkstack.fullname" . }}
          port: {{ .Values.service.port }}
