
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "linkstack.fullname" . }}
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
  labels:
    {{- include "linkstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: web

spec:
  replicas: {{ .Values.replicaCount }}

  strategy:
    type: Recreate

  selector:
    matchLabels:
      {{- include "linkstack.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "linkstack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web

    spec:
      securityContext:
        fsGroup: 48
        fsGroupChangePolicy: OnRootMismatch

      initContainers:
        # Wait until MySQL is accepting connections.
        - name: wait-mysql
          image: "{{ .Values.waitImage.repository }}:{{ .Values.waitImage.tag }}"
          imagePullPolicy: {{ .Values.waitImage.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              until nc -z {{ include "linkstack.fullname" . }}-mysql {{ .Values.mysql.service.port }}; do
                echo "Waiting for MySQL..."
                sleep 2
              done

        # Initialize the persistent volume only if needed.
        - name: seed-data
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              if [ ! -f /data/version.json ]; then
                cp -a /htdocs/. /data/
              fi
              chown 48:48 /data
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: data
              mountPath: /data

        # Configure Laravel to use MySQL.
        - name: configure-mysql
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              php83 -r '
              $path = "/htdocs/.env";
              $contents = file_get_contents($path);

              if ($contents === false) {
                  fwrite(STDERR, "Cannot read .env file\n");
                  exit(1);
              }

              $contents = str_replace("\\\n", "\n", $contents);

              $values = [
                  "APP_URL" => "https://{{ .Values.config.publicHost }}",
                  "APP_ENV" => "production",
                  "APP_DEBUG" => "false",
                  "DB_CONNECTION" => getenv("DB_CONNECTION"),
                  "DB_HOST" => getenv("DB_HOST"),
                  "DB_PORT" => getenv("DB_PORT"),
                  "DB_DATABASE" => getenv("DB_DATABASE"),
                  "DB_USERNAME" => getenv("DB_USERNAME"),
                  "DB_PASSWORD" => getenv("DB_PASSWORD"),
              ];

              foreach ($values as $key => $value) {
                  $escaped = addcslashes($value, "\\\"");
                  $line = $key . "=\"" . $escaped . "\"";
                  $pattern = "/^" . preg_quote($key, "/") . "=.*$/m";

                  if (preg_match($pattern, $contents)) {
                      $contents = preg_replace_callback(
                          $pattern,
                          function () use ($line) {
                              return $line;
                          },
                          $contents
                      );
                  } else {
                      $contents .= "\n" . $line . "\n";
                  }
              }

              if (file_put_contents($path, $contents) === false) {
                  fwrite(STDERR, "Cannot write .env file\n");
                  exit(1);
              }
              '
          env:
            - name: DB_CONNECTION
              value: "mysql"

            - name: DB_HOST
              value: '{{ include "linkstack.fullname" . }}-mysql'

            - name: DB_PORT
              value: {{ .Values.mysql.service.port | quote }}

            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dbSecretName }}
                  key: MYSQL_DATABASE

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dbSecretName }}
                  key: MYSQL_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dbSecretName }}
                  key: MYSQL_PASSWORD

          volumeMounts:
            - name: data
              mountPath: /htdocs

        # Run database migrations before starting LinkStack.
        - name: migrate-mysql
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              cd /htdocs
              php83 artisan migrate --force --no-interaction

          env:
            - name: DB_CONNECTION
              value: "mysql"

            - name: DB_HOST
              value: '{{ include "linkstack.fullname" . }}-mysql'

            - name: DB_PORT
              value: {{ .Values.mysql.service.port | quote }}

            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dbSecretName }}
                  key: MYSQL_DATABASE

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dbSecretName }}
                  key: MYSQL_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dbSecretName }}
                  key: MYSQL_PASSWORD

          volumeMounts:
            - name: data
              mountPath: /htdocs

      containers:
        - name: linkstack
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          env:
            - name: DB_CONNECTION
              value: "mysql"

            - name: DB_HOST
              value: '{{ include "linkstack.fullname" . }}-mysql'

            - name: DB_PORT
              value: {{ .Values.mysql.service.port | quote }}

            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dbSecretName }}
                  key: MYSQL_DATABASE

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dbSecretName }}
                  key: MYSQL_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dbSecretName }}
                  key: MYSQL_PASSWORD

            - name: MAIL_MAILER
              value: "smtp"

            - name: MAIL_FROM_NAME
              value: "LinkStack"

            - name: TZ
              value: {{ .Values.config.timezone | quote }}

            - name: SERVER_ADMIN
              value: {{ .Values.config.serverAdmin | quote }}

            - name: HTTP_SERVER_NAME
              value: {{ .Values.config.publicHost | quote }}

            - name: HTTPS_SERVER_NAME
              value: {{ .Values.config.publicHost | quote }}

            - name: PHP_MEMORY_LIMIT
              value: {{ .Values.config.phpMemoryLimit | quote }}

            - name: UPLOAD_MAX_FILESIZE
              value: {{ .Values.config.uploadMaxFilesize | quote }}

          envFrom:
            - secretRef:
                name: {{ .Values.secrets.dbSecretName }}

          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - |
                  wget -q \
                    --header="Host: {{ .Values.config.publicHost }}" \
                    -O /dev/null \
                    http://127.0.0.1/
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24

          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - |
                  wget -q \
                    --header="Host: {{ .Values.config.publicHost }}" \
                    -O /dev/null \
                    http://127.0.0.1/
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - |
                  wget -q \
                    --header="Host: {{ .Values.config.publicHost }}" \
                    -O /dev/null \
                    http://127.0.0.1/
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            - name: data
              mountPath: /htdocs

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "linkstack.fullname" . }}-data
