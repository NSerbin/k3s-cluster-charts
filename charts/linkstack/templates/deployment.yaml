apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "linkstack.fullname" . }}
  labels:
    {{- include "linkstack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "linkstack.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "linkstack.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 48
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: wait-mysql
          image: "{{ .Values.waitImage.repository }}:{{ .Values.waitImage.tag }}"
          imagePullPolicy: {{ .Values.waitImage.pullPolicy }}
          command:
            - sh
            - -ec
            - until nc -z {{ include "linkstack.fullname" . }}-mysql {{ .Values.mysql.service.port }}; do sleep 2; done
        # A Kubernetes PVC hides the image's /htdocs tree. Seed it once, then
        # preserve LinkStack configuration, themes and uploaded assets.
        - name: seed-data
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              if [ ! -f /data/version.json ]; then
                cp -a /htdocs/. /data/
              fi
              chown 48:48 /data
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: data
              mountPath: /data
        - name: configure-mysql
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              php83 -r '
              $path = "/htdocs/.env";
              $contents = file_get_contents($path);
              $contents = str_replace("\\n", "\n", $contents);
              $values = [
                "APP_URL" => "https://{{ .Values.config.publicHost }}",
                "APP_ENV" => "production",
                "APP_DEBUG" => "false",
                "DB_CONNECTION" => getenv("DB_CONNECTION"),
                "DB_HOST" => getenv("DB_HOST"),
                "DB_PORT" => getenv("DB_PORT"),
                "DB_DATABASE" => getenv("DB_DATABASE"),
                "DB_USERNAME" => getenv("DB_USERNAME"),
                "DB_PASSWORD" => getenv("DB_PASSWORD"),
              ];
              foreach ($values as $key => $value) {
                $line = $key . "=\"" . $value . "\"";
                $pattern = "/^" . preg_quote($key, "/") . "=.*/m";
                $contents = preg_match($pattern, $contents) ? preg_replace($pattern, $line, $contents) : $contents . "\n" . $line . "\n";
              }
              file_put_contents($path, $contents);
              '
          env:
            - name: DB_CONNECTION
              value: mysql
            - name: DB_HOST
              value: {{ include "linkstack.fullname" . }}-mysql
            - name: DB_PORT
              value: {{ .Values.mysql.service.port | quote }}
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dbSecretName }}
                  key: MYSQL_DATABASE
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dbSecretName }}
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dbSecretName }}
                  key: MYSQL_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /htdocs
        - name: migrate-mysql
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -ec
            - php83 artisan migrate --force --no-interaction
          env:
            - name: DB_CONNECTION
              value: mysql
            - name: DB_HOST
              value: {{ include "linkstack.fullname" . }}-mysql
            - name: DB_PORT
              value: {{ .Values.mysql.service.port | quote }}
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dbSecretName }}
                  key: MYSQL_DATABASE
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dbSecretName }}
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dbSecretName }}
                  key: MYSQL_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /htdocs
      containers:
        - name: linkstack
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: DB_CONNECTION
              value: mysql
            - name: DB_HOST
              value: {{ include "linkstack.fullname" . }}-mysql
            - name: DB_PORT
              value: {{ .Values.mysql.service.port | quote }}
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dbSecretName }}
                  key: MYSQL_DATABASE
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dbSecretName }}
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dbSecretName }}
                  key: MYSQL_PASSWORD
            - name: MAIL_MAILER
              value: smtp
            - name: MAIL_FROM_NAME
              value: LinkStack
            - name: TZ
              value: {{ .Values.config.timezone | quote }}
            - name: SERVER_ADMIN
              value: {{ .Values.config.serverAdmin | quote }}
            - name: HTTP_SERVER_NAME
              value: {{ .Values.config.publicHost | quote }}
            - name: HTTPS_SERVER_NAME
              value: {{ .Values.config.publicHost | quote }}
            - name: PHP_MEMORY_LIMIT
              value: {{ .Values.config.phpMemoryLimit | quote }}
            - name: UPLOAD_MAX_FILESIZE
              value: {{ .Values.config.uploadMaxFilesize | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.dbSecretName }}
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - wget -q --header="Host: {{ .Values.config.publicHost }}" -O /dev/null http://127.0.0.1/
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - wget -q --header="Host: {{ .Values.config.publicHost }}" -O /dev/null http://127.0.0.1/
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - wget -q --header="Host: {{ .Values.config.publicHost }}" -O /dev/null http://127.0.0.1/
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /htdocs
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "linkstack.fullname" . }}-data
