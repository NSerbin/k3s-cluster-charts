apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.dbSecretName }}
  labels:
    {{- include "linkstack.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: {{ .Values.secrets.dbSecretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.secrets.vaultPath | quote }}
  data:
    - secretKey: MAIL_HOST
      remoteRef:
        key: k8s/core/tools/emails/smtp
        property: SMTP_HOST
    - secretKey: MAIL_PORT
      remoteRef:
        key: k8s/core/tools/emails/smtp
        property: SMTP_PORT
    - secretKey: MAIL_USERNAME
      remoteRef:
        key: k8s/core/tools/emails/smtp
        property: SMTP_USERNAME
    - secretKey: MAIL_PASSWORD
      remoteRef:
        key: k8s/core/tools/emails/smtp
        property: SMTP_PASSWORD
    - secretKey: MAIL_FROM_ADDRESS
      remoteRef:
        key: k8s/core/tools/emails/smtp
        property: SMTP_FROM
    - secretKey: MAIL_ENCRYPTION
      remoteRef:
        key: k8s/core/tools/emails/smtp
        property: SMTP_SECURITY
