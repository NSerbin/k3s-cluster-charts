{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.monitoring.serviceMonitor.name | default "vault" }}
  namespace: {{ .Release.Namespace }}
  labels:
{{- toYaml .Values.monitoring.serviceMonitor.labels | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
{{- toYaml .Values.monitoring.serviceMonitor.selectorLabels | nindent 6 }}
  endpoints:
    - port: {{ .Values.monitoring.serviceMonitor.portName | default "http" }}
      path: {{ .Values.monitoring.serviceMonitor.path | default "/v1/sys/metrics" }}
      interval: {{ .Values.monitoring.serviceMonitor.interval | default "30s" }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout | default "10s" }}
      scheme: {{ .Values.monitoring.serviceMonitor.scheme | default "http" }}
      params:
        format:
          - "prometheus"
{{- end }}
