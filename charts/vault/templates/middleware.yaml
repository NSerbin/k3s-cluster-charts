{{- if and .Values.traefik.enabled .Values.traefik.middlewares.securityHeaders.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: vault-security-headers
  namespace: {{ .Release.Namespace }}
spec:
  headers:
    stsSeconds: {{ .Values.traefik.middlewares.securityHeaders.stsSeconds }}
    stsIncludeSubdomains: {{ .Values.traefik.middlewares.securityHeaders.stsIncludeSubdomains }}
    stsPreload: {{ .Values.traefik.middlewares.securityHeaders.stsPreload }}
    contentTypeNosniff: {{ .Values.traefik.middlewares.securityHeaders.contentTypeNosniff }}
    browserXssFilter: {{ .Values.traefik.middlewares.securityHeaders.browserXssFilter }}
    frameDeny: {{ .Values.traefik.middlewares.securityHeaders.frameDeny }}
    referrerPolicy: {{ .Values.traefik.middlewares.securityHeaders.referrerPolicy | quote }}
---
{{- end }}

{{- if and .Values.traefik.enabled .Values.traefik.middlewares.rateLimit.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: vault-rate-limit
  namespace: {{ .Release.Namespace }}
spec:
  rateLimit:
    average: {{ .Values.traefik.middlewares.rateLimit.average }}
    burst: {{ .Values.traefik.middlewares.rateLimit.burst }}
---
{{- end }}

{{- if and .Values.traefik.enabled .Values.traefik.middlewares.ipAllowList.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: vault-ip-allowlist
  namespace: {{ .Release.Namespace }}
spec:
  ipAllowList:
    sourceRange:
{{- range .Values.traefik.middlewares.ipAllowList.sourceRange }}
      - {{ . | quote }}
{{- end }}
---
{{- end }}

{{- if and .Values.traefik.enabled .Values.traefik.ingressRoute.middlewares.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: vault-default-chain
  namespace: {{ .Release.Namespace }}
spec:
  chain:
    middlewares:
{{- if .Values.traefik.middlewares.securityHeaders.enabled }}
      - name: vault-security-headers
{{- end }}
{{- if .Values.traefik.middlewares.rateLimit.enabled }}
      - name: vault-rate-limit
{{- end }}
{{- if .Values.traefik.middlewares.ipAllowList.enabled }}
      - name: vault-ip-allowlist
{{- end }}
{{- end }}
