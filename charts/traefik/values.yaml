traefik:
  deployment:
    enabled: true
    replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  service:
    enabled: true
    type: LoadBalancer
    spec:
      loadBalancerIP: 192.168.0.233

  providers:
    kubernetesCRD:
      enabled: true
    kubernetesIngress:
      enabled: true

  ports:
    web:
      port: 80
      expose:
        default: true
      exposedPort: 80
      protocol: TCP
      # redirections:
      #   entryPoint:
      #     to: websecure
      #     scheme: https
      #     permanent: true

    websecure:
      port: 443
      expose:
        default: true
      exposedPort: 443
      protocol: TCP
    traefik:
      port: 9000
      expose:
        default: true
      exposedPort: 9000
      protocol: TCP


  logs:
    general:
      level: INFO

    access:
      enabled: true
      format: json

  metrics:
    prometheus:
      enabled: true
      addEntryPointsLabels: true
      addRoutersLabels: true
      addServicesLabels: true

  api:
    dashboard: true
    insecure: true

  additionalArguments:
    - "--ping=true"
    - "--entryPoints.web.forwardedHeaders.insecure=true"
    - "--entryPoints.websecure.forwardedHeaders.insecure=true"
    - "--entrypoints.traefik.address=:9000"

  securityContext:
    capabilities:
      drop: [ "ALL" ]
    allowPrivilegeEscalation: false

  podSecurityContext:
    fsGroup: 65532

  persistence:
    enabled: false


dashboard:
  enabled: true
  host: "traefik.nserbin.com"
  #entryPoint: "websecure"
  entryPoint: "web"



crowdsecBouncer:
  # Disabled by default to avoid crashing Traefik rollout when image/tag or secret are not ready.
  enabled: false
  replicaCount: 1
  image:
    repository: fbonalair/traefik-crowdsec-bouncer
    tag: latest
    pullPolicy: IfNotPresent
  logLevel: INFO
  crowdsecLapiUrl: http://crowdsec-service.security.svc.cluster.local:8080
  crowdsecMode: live
  updateIntervalSeconds: 60
  redisCacheEnabled: false
  secrets:
    existingSecret: crowdsec-bouncer-secrets
    keyField: BOUNCER_KEY_traefik
  middleware:
    enabled: true
    name: crowdsec-bouncer
    # Avoid attaching automatically to dashboard until bouncer is validated in-cluster.
    attachToDashboard: false
