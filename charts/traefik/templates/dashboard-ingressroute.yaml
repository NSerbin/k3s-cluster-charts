{{- if .Values.dashboard.enabled }}
{{- $ba := (.Values.dashboard.basicAuth | default dict) -}}
{{- $csb := (.Values.crowdsecBouncer | default dict) -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: traefik
spec:
  entryPoints:
    - {{ .Values.dashboard.entryPoint | default "web" }}
  routes:
    - match: Host(`{{ .Values.dashboard.host }}`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
      kind: Rule
      {{- if or ($ba.enabled | default false) (and ($csb.enabled | default false) ($csb.middleware.enabled | default false) ($csb.middleware.attachToDashboard | default false)) }}
      middlewares:
        {{- if ($ba.enabled | default false) }}
        - name: traefik-dashboard-auth
        {{- end }}
        {{- if and ($csb.enabled | default false) ($csb.middleware.enabled | default false) }}
        - name: {{ $csb.middleware.name | default "crowdsec-bouncer" }}
        {{- end }}
      {{- end }}
      services:
        - name: api@internal
          kind: TraefikService
{{- end }}
