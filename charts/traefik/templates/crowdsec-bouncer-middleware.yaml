{{- if and .Values.crowdsecBouncer.enabled .Values.crowdsecBouncer.middleware.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Values.crowdsecBouncer.middleware.name }}
  namespace: traefik
spec:
  forwardAuth:
    address: http://crowdsec-traefik-bouncer.traefik.svc.cluster.local:8080/api/v1/forwardAuth
    trustForwardHeader: true
{{- end }}
