{{- $csb := (.Values.crowdsecBouncer | default dict) -}}
{{- $middleware := ($csb.middleware | default dict) -}}
{{- if and ($csb.enabled | default false) ($middleware.enabled | default false) }}
{{- $secrets := ($csb.secrets | default dict) -}}
{{- $secretMountPath := ($secrets.mountPath | default "/etc/traefik/secrets/crowdsec-bouncer") -}}
{{- $secretKeyField := ($secrets.keyField | default "BOUNCER_KEY_traefik") -}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $middleware.name | default "crowdsec-bouncer" }}
  namespace: traefik
spec:
  plugin:
    bouncer:
      enabled: true
      crowdsecMode: {{ $middleware.crowdsecMode | default "stream" | quote }}
      crowdsecLapiScheme: {{ $middleware.crowdsecLapiScheme | default "http" | quote }}
      crowdsecLapiHost: {{ required "crowdsecBouncer.middleware.crowdsecLapiHost is required" $middleware.crowdsecLapiHost | quote }}
      crowdsecLapiKeyFile: {{ ($middleware.crowdsecLapiKeyFile | default (printf "%s/%s" $secretMountPath $secretKeyField)) | quote }}
      forwardedHeadersTrustedIPs:
{{ toYaml ($middleware.forwardedHeadersTrustedIPs | default list) | indent 8 }}
      {{- with $middleware.clientTrustedIPs }}
      clientTrustedIPs:
{{ toYaml . | indent 8 }}
      {{- end }}
      updateIntervalSeconds: {{ $middleware.updateIntervalSeconds | default 60 }}
      metricsUpdateIntervalSeconds: {{ $middleware.metricsUpdateIntervalSeconds | default 60 }}
      remediationStatusCode: {{ $middleware.remediationStatusCode | default 403 }}
      httpTimeoutSeconds: {{ $middleware.httpTimeoutSeconds | default 10 }}
      crowdsecAppsecEnabled: {{ $middleware.crowdsecAppsecEnabled | default false }}
      crowdsecAppsecHost: {{ $middleware.crowdsecAppsecHost | quote }}
      crowdsecAppsecPath: {{ $middleware.crowdsecAppsecPath | default "/" | quote }}
      crowdsecAppsecFailureBlock: {{ $middleware.crowdsecAppsecFailureBlock | default false }}
      crowdsecAppsecUnreachableBlock: {{ $middleware.crowdsecAppsecUnreachableBlock | default false }}
      crowdsecAppsecBodyLimit: {{ $middleware.crowdsecAppsecBodyLimit | default 10485760 | int64 }}
{{- end }}
