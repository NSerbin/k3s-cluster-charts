{{- if .Values.crowdsecBouncer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdsec-traefik-bouncer
  namespace: traefik
spec:
  replicas: {{ .Values.crowdsecBouncer.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: crowdsec-traefik-bouncer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crowdsec-traefik-bouncer
    spec:
      containers:
        - name: bouncer
          image: "{{ .Values.crowdsecBouncer.image.repository }}:{{ .Values.crowdsecBouncer.image.tag }}"
          imagePullPolicy: {{ .Values.crowdsecBouncer.image.pullPolicy }}
          env:
            - name: CROWDSEC_LAPI_URL
              value: {{ .Values.crowdsecBouncer.crowdsecLapiUrl | quote }}
            - name: CROWDSEC_LAPI_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.crowdsecBouncer.secrets.existingSecret }}
                  key: {{ .Values.crowdsecBouncer.secrets.keyField }}
            - name: CROWDSEC_LOG_LEVEL
              value: {{ .Values.crowdsecBouncer.logLevel | quote }}
            - name: CROWDSEC_BOUNCER_MODE
              value: {{ .Values.crowdsecBouncer.crowdsecMode | quote }}
            - name: CROWDSEC_UPDATE_INTERVAL_SECONDS
              value: {{ .Values.crowdsecBouncer.updateIntervalSeconds | quote }}
            - name: REDIS_CACHE_ENABLED
              value: {{ ternary "true" "false" .Values.crowdsecBouncer.redisCacheEnabled | quote }}
          ports:
            - name: http
              containerPort: 8080
{{- end }}
