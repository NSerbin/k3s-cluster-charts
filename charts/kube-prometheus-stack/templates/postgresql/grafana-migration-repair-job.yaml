{{- if .Values.postgresql.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-grafana-db-migration-repair
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-db-migration-repair
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: repair
          image: {{ .Values.postgresql.image | quote }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: grafana-secrets-db
          command:
            - sh
            - -ec
            - |
              until pg_isready -h {{ .Values.postgresql.serviceName }}.{{ .Release.Namespace }}.svc.cluster.local -p {{ .Values.postgresql.port }} -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                sleep 2
              done

              PGPASSWORD="$POSTGRES_PASSWORD" psql -v ON_ERROR_STOP=1 \
                -h {{ .Values.postgresql.serviceName }}.{{ .Release.Namespace }}.svc.cluster.local \
                -p {{ .Values.postgresql.port }} \
                -U "$POSTGRES_USER" \
                -d "$POSTGRES_DB" <<'SQL'
              DO $$
              BEGIN
                IF to_regclass('public."IDX_dashboard_provisioning_dashboard_id"') IS NOT NULL
                   AND to_regclass('public.migration_log') IS NOT NULL
                   AND NOT EXISTS (
                     SELECT 1
                     FROM migration_log
                     WHERE migration_id = 'create index IDX_dashboard_provisioning_dashboard_id - v2'
                       AND success = true
                   )
                THEN
                  DELETE FROM migration_log
                  WHERE migration_id = 'create index IDX_dashboard_provisioning_dashboard_id - v2';

                  INSERT INTO migration_log (migration_id, sql, success, error, timestamp)
                  VALUES (
                    'create index IDX_dashboard_provisioning_dashboard_id - v2',
                    'CREATE INDEX "IDX_dashboard_provisioning_dashboard_id" ON "dashboard_provisioning" ("dashboard_id");',
                    true,
                    '',
                    NOW()
                  );
                END IF;
              END $$;
              SQL
{{- end }}
