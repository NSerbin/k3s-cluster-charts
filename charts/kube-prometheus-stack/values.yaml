# Preferido: secret pre-creado (ExternalSecrets/SOPS/manual)
# secrets:
#   existingSecret: "grafana-secrets-db"
#   create: false

kube-prometheus-stack:
  
  # Preferido: secret pre-creado (ExternalSecrets/SOPS/manual)
  secrets:
    existingSecret: "grafana-secrets-db"
    create: false
  
  # =========================
  # PROMETHEUS              
  # =========================  
  
  prometheus:
    enabled: true
    prometheusSpec:
      retention: 7d
      scrapeInterval: 30s
      evaluationInterval: 30s
      walCompression: true

      serviceMonitorSelector: {}
      serviceMonitorNamespaceSelector: {}
      podMonitorSelector: {}
      podMonitorNamespaceSelector: {}

      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1
          memory: 2Gi

      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi

      enableAdminAPI: false

  prometheusOperator:
    admissionWebhooks:
      enabled: false

  # =========================
  # GRAFANA
  # =========================
  
  grafana:
    enabled: true
    image:
      repository: grafana/grafana
      tag: "13.0.1"
      pullPolicy: IfNotPresent

    existingSecret: grafana-secrets-admin

    defaultDashboardsEnabled: true
    defaultDashboardsTimezone: "browser"

    plugins:
      - andrewbmchugh-flow-panel
      - volkovlabs-echarts-panel
      - yesoreyeram-infinity-datasource

    securityContext:
      runAsNonRoot: true
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472

    initChownData:
      enabled: false

    sidecar:
      datasources:
        enabled: true
        initDatasources: false
        skipReload: true
    
    envFromSecrets:
      - name: grafana-secrets-oidc
      - name: grafana-secrets-github-oidc
      - name: grafana-secrets-github-app
      - name: grafana-secrets-db

    grafana.ini:
      database:
        type: postgres
        host: grafana-postgres.monitoring.svc.cluster.local:5432
        name: $__env{POSTGRES_DB}
        user: $__env{POSTGRES_USER}
        password: $__env{POSTGRES_PASSWORD}
        ssl_mode: disable
      
      server:
        domain: monitor.nserbin.com
        root_url: https://monitor.nserbin.com/
        serve_from_sub_path: false

      security:
        cookie_secure: true
        cookie_samesite: lax
        disable_gravatar: true
        allow_embedding: false
        csrf_trusted_origins: https://monitor.nserbin.com

      users:
        allow_sign_up: false
        allow_org_create: false
        auto_assign_org: true
        auto_assign_org_role: Viewer


      auth.generic_oauth:
          name: authentik
          enabled: true
          client_id: $__env{AUTHENTIK_CLIENT_ID}
          client_secret: $__env{AUTHENTIK_CLIENT_SECRET}
          scopes: "openid profile email"
          auth_url: $__env{AUTHENTIK_AUTH_URL}
          token_url: $__env{AUTHENTIK_TOKEN_URL}
          api_url: $__env{AUTHENTIK_API_URL}
          allow_assign_grafana_admin: true
          # Optionally map user groups to Grafana roles
          role_attribute_path: email == 'nicolas.serbin@gmail.com' && 'GrafanaAdmin' || contains(groups, 'Grafana Admins') && 'GrafanaAdmin' || contains(groups, 'Grafana Editors') && 'Editor' || 'Viewer'

      auth:
        disable_login_form: false
        signout_redirect_url: $__env{AUTHENTIK_SIGNOUT_REDIRECT_URL}

      auth.basic:
        enabled: true
        
      api:
        enabled: true        

      log:
        mode: console
        level: info
      date_formats:
        default_timezone: browser

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 512Mi

    persistence:
      enabled: true
      storageClassName: local-path
      size: 5Gi

    service:
      type: ClusterIP

    envValueFrom: {}

  # =========================
  # NODE EXPORTER + KSM
  # =========================
  
  nodeExporter:
    enabled: true

  kubeStateMetrics:
    enabled: true

  # =========================
  # ALERTMANAGER
  # =========================

  alertmanager:
    enabled: true

    alertmanagerSpec:
      externalUrl: https://alerts.nserbin.com    
      retention: 120h

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 2Gi

      volumes:
        - name: alertmanager-templates
          configMap:
            name: alertmanager-templates
      volumeMounts:
        - name: alertmanager-templates
          mountPath: /etc/alertmanager/templates
          readOnly: true


      alertmanagerConfigNamespaceSelector: {}
      alertmanagerConfigSelector:
        matchLabels:
          alertmanagerconfig: "enabled"

      configMaps:
              - alertmanager-templates

    config:
      templates:
        - /etc/alertmanager/templates/*.tmpl    
      global:
        resolve_timeout: 5m
      route:
        receiver: "null"
        group_by: ["alertname", "namespace", "severity"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
      receivers:
        - name: "null"

  kubeApiServer:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  kubeEtcd:
    enabled: false

  defaultRules:
    create: true
    rules:
      alertmanager: true
      configReloaders: true
      general: true
      kubeApiserver: false
      kubeControllerManager: false
      kubeScheduler: false
      kubeEtcd: false
      kubelet: true
      kubernetesApps: true
      kubernetesResources: false
      kubernetesStorage: true
      kubernetesSystem: false
      node: true
      prometheus: true
      prometheusOperator: true

externalTargets:
  enabled: true

  namespace: monitoring

  releaseLabel:
    key: release
    value: kube-prometheus-stack

  # External Hosts
  targets:
    - name: rpi
      ip: 192.168.0.4
      exporters:
        - name: node
          port: 9100
          path: /metrics
          interval: 30s
          scrapeTimeout: 10s
        - name: cadvisor
          port: 8080
          path: /metrics
          interval: 30s
          scrapeTimeout: 10s
        - name: cloudflare-tunnels
          port: 60123
          path: /metrics
          interval: 30s
          scrapeTimeout: 10s


traefikRoutes:
  enabled: true
  namespace: monitoring
  entryPoints:
    - web

  routes:
    - name: grafana
      enabled: true
      host: monitor.nserbin.com
      service:
        name: kube-prometheus-stack-grafana
        port: 80
      pathPrefixes: ["/"]
      middlewares: []

    - name: prometheus
      enabled: true
      host: prometheus.nserbin.com
      service:
        name: kube-prometheus-stack-prometheus
        port: 9090
      pathPrefixes: ["/"]
      middlewares: []

    - name: alertmanager
      enabled: true
      host: alerts.nserbin.com
      service:
        name: kube-prometheus-stack-alertmanager
        port: 9093
      pathPrefixes: ["/"]
      middlewares: []

alerting:
  enabled: true
  namespace: monitoring

  selectorLabels:
    alertmanagerconfig: "enabled"

  slack:
    channel: "#ns-alarms-grafana"

  receivers:
    - name: slack-warnings
      type: slack
      apiURLSecretRef:
        name: alertmanager-secrets-notifications
        key: SLACK_WEBHOOK_URL
      sendResolved: true
      titleTemplate: "slack.title"
      textTemplate: "slack.text"   

    - name: slack-critical
      type: slack
      apiURLSecretRef:
        name: alertmanager-secrets-notifications
        key: SLACK_WEBHOOK_URL
      sendResolved: true
      titleTemplate: "slack.title"
      textTemplate: "slack.text"   


  routes:
    rootReceiver: slack-warnings
    groupBy: ["alertname", "namespace", "severity"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h

    rules:
      - name: drop-watchdog
        receiver: "null"
        matchers:
          - name: alertname
            value: Watchdog
            matchType: "="

      - name: critical-to-critical
        receiver: slack-critical
        matchers:
          - name: severity
            value: critical
            matchType: "="

      - name: warning-to-warnings
        receiver: slack-warnings
        matchers:
          - name: severity
            value: warning
            matchType: "="

# =========================
# POSTGRESQL (Grafana DB)
# =========================

postgresql:
  enabled: true
  image: "postgres:16.3-alpine3.20"
  serviceName: "grafana-postgres"
  port: 5432
  storage:
    size: 2Gi

  # Keys que deben existir en el secret grafana-secrets-db
  dbNameKey: POSTGRES_DB
  userKey: POSTGRES_USER
  passwordKey: POSTGRES_PASSWORD
