{{- if .Values.bootstrap.managedDatabases }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "terraform-shared-backend.fullname" . }}-initdb
  labels:
    {{- include "terraform-shared-backend.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
data:
  10-managed-databases.sh: |
    #!/bin/sh
    set -eu

    for database in{{ range .Values.bootstrap.managedDatabases }} {{ . | quote }}{{ end }}; do
      if ! psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres --tuples-only --no-align --command "SELECT 1 FROM pg_database WHERE datname = '$database'" | grep -q '^1$'; then
        createdb --username "$POSTGRES_USER" --owner "$POSTGRES_USER" "$database"
      fi
    done
{{- end }}
