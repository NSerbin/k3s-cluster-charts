apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "appflowy.webName" . }}
  labels:
    {{- include "appflowy.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "appflowy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "appflowy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      initContainers:
        - name: wait-cloud
          image: "{{ .Values.waitImage.repository }}:{{ .Values.waitImage.tag }}"
          imagePullPolicy: {{ .Values.waitImage.pullPolicy }}
          command: ["sh", "-lc", "until nc -z {{ include "appflowy.cloudName" . }} {{ .Values.cloud.service.port }}; do sleep 2; done"]
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          env:
            - name: APPFLOWY_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "appflowy.fullname" . }}-config
                  key: APPFLOWY_BASE_URL
            - name: APPFLOWY_GOTRUE_BASE_URL
              value: {{ printf "%s://%s/gotrue" .Values.config.scheme .Values.config.fqdn | quote }}
            - name: APPFLOWY_WS_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "appflowy.fullname" . }}-config
                  key: APPFLOWY_WEBSOCKET_BASE_URL
          ports:
            - name: http
              containerPort: {{ .Values.web.service.port }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "appflowy.webName" . }}
  labels:
    {{- include "appflowy.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
  selector:
    {{- include "appflowy.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
