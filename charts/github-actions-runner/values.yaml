namespaces:
  create: false
  controller: arc-systems
  runners: github-runners

secrets:
  githubConfigSecretName: github-actions-runner-github-app
  vaultPath: k8s/core/cicd/github-actions-runner/github-app

controller:
  enabled: true
  namespaceOverride: arc-systems
  fullnameOverride: arc-controller
  replicaCount: 1
  image:
    repository: ghcr.io/actions/gha-runner-scale-set-controller
    tag: "0.15.1"
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: arc-controller
  flags:
    logLevel: info
    logFormat: text
    updateStrategy: immediate
    runnerMaxConcurrentReconciles: 2
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podSecurityContext:
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL

deployRunnerScaleSet:
  enabled: true
  namespaceOverride: github-runners
  githubConfigUrl: https://github.com/NSerbin-web
  githubConfigSecret: github-actions-runner-github-app
  controllerServiceAccount:
    namespace: arc-systems
    name: arc-controller
  runnerScaleSetName: nserbin-deploy
  minRunners: 0
  maxRunners: 1
  listenerTemplate:
    spec:
      containers:
        - name: listener
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: runner
          image: ghcr.io/actions/actions-runner:2.331.0
          imagePullPolicy: IfNotPresent
          command:
            - /home/runner/run.sh
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: 1000m
              memory: 1536Mi
              ephemeral-storage: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 4Gi

buildRunnerScaleSet:
  enabled: true
  namespaceOverride: github-runners
  githubConfigUrl: https://github.com/NSerbin-web
  githubConfigSecret: github-actions-runner-github-app
  controllerServiceAccount:
    namespace: arc-systems
    name: arc-controller
  runnerScaleSetName: nserbin-build
  minRunners: 0
  maxRunners: 1
  listenerTemplate:
    spec:
      containers:
        - name: listener
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
  template:
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload.nserbin.com/lenovo: "true"
      securityContext:
        fsGroup: 123
      initContainers:
        - name: init-dind-externals
          image: ghcr.io/actions/actions-runner:2.331.0
          imagePullPolicy: IfNotPresent
          command:
            - cp
          args:
            - -r
            - /home/runner/externals/.
            - /home/runner/tmpDir/
          volumeMounts:
            - name: dind-externals
              mountPath: /home/runner/tmpDir
      containers:
        - name: runner
          image: ghcr.io/actions/actions-runner:2.331.0
          imagePullPolicy: IfNotPresent
          command:
            - /home/runner/run.sh
          env:
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
            - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
              value: "120"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: 1000m
              memory: 1Gi
              ephemeral-storage: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: dind-sock
              mountPath: /var/run
        - name: dind
          image: docker:28.5.2-dind
          imagePullPolicy: IfNotPresent
          args:
            - dockerd
            - --host=unix:///var/run/docker.sock
            - --group=$(DOCKER_GROUP_GID)
          env:
            - name: DOCKER_GROUP_GID
              value: "123"
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 3Gi
            limits:
              cpu: 1000m
              memory: 1Gi
              ephemeral-storage: 8Gi
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: dind-sock
              mountPath: /var/run
            - name: dind-externals
              mountPath: /home/runner/externals
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 10Gi
        - name: dind-sock
          emptyDir:
            sizeLimit: 256Mi
        - name: dind-externals
          emptyDir:
            sizeLimit: 2Gi

terraformRunnerScaleSet:
  enabled: true
  namespaceOverride: github-runners
  githubConfigUrl: https://github.com/NSerbin-web
  githubConfigSecret: github-actions-runner-github-app
  controllerServiceAccount:
    namespace: arc-systems
    name: arc-controller
  runnerScaleSetName: nserbin-terraform
  runnerGroup: terraform
  minRunners: 0
  maxRunners: 1
  listenerTemplate:
    spec:
      containers:
        - name: listener
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
  template:
    spec:
      serviceAccountName: arc-terraform-runner
      automountServiceAccountToken: true
      containers:
        - name: runner
          image: ghcr.io/actions/actions-runner:2.331.0
          imagePullPolicy: IfNotPresent
          command:
            - /home/runner/run.sh
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: 1000m
              memory: 1536Mi
              ephemeral-storage: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 4Gi
