apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.existingSecret }}
  labels:
    {{- include "affine.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: {{ .Values.secrets.existingSecret }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.secrets.vaultPath | quote }}
  data:
    - secretKey: MAILER_HOST
      remoteRef:
        key: k8s/core/tools/emails/smtp
        property: SMTP_HOST
    - secretKey: MAILER_PORT
      remoteRef:
        key: k8s/core/tools/emails/smtp
        property: SMTP_PORT
    - secretKey: MAILER_USER
      remoteRef:
        key: k8s/core/tools/emails/smtp
        property: SMTP_USERNAME
    - secretKey: MAILER_PASSWORD
      remoteRef:
        key: k8s/core/tools/emails/smtp
        property: SMTP_PASSWORD
    - secretKey: MAILER_SENDER
      remoteRef:
        key: k8s/core/tools/emails/smtp
        property: SMTP_FROM
