apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "affine.fullname" . }}-config
  labels:
    {{- include "affine.labels" . | nindent 4 }}
data:
  config.json: |
    {
      "$schema": "https://github.com/toeverything/AFFiNE/releases/latest/download/config.schema.json",
      "server": {
        "name": "AFFiNE",
        "externalUrl": {{ .Values.config.externalUrl | quote }}
      }
    }
