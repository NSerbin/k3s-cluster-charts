apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "affine.fullname" . }}
  labels:
    {{- include "affine.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "affine.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "affine.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ include "affine.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-postgres
          image: {{ include "affine.waitImage" . | quote }}
          imagePullPolicy: {{ .Values.waitImage.pullPolicy }}
          command: ["sh", "-ec", "until nc -z {{ include "affine.postgresName" . }} {{ .Values.postgres.service.port }}; do sleep 2; done"]
        - name: wait-redis
          image: {{ include "affine.waitImage" . | quote }}
          imagePullPolicy: {{ .Values.waitImage.pullPolicy }}
          command: ["sh", "-ec", "until nc -z {{ include "affine.redisName" . }} {{ .Values.redis.service.port }}; do sleep 2; done"]
        - name: migrate
          image: {{ include "affine.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-ec", "node ./scripts/self-host-predeploy.js"]
          env:
            {{- include "affine.env" . | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: {{ .Values.config.storagePath | quote }}
            - name: config
              mountPath: {{ printf "%s/config.json" .Values.config.configPath | quote }}
              subPath: config.json
              readOnly: true
      containers:
        - name: affine
          image: {{ include "affine.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "affine.env" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: {{ .Values.traefik.ingressRoute.host | quote }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: {{ .Values.traefik.ingressRoute.host | quote }}
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: {{ .Values.config.storagePath | quote }}
            - name: config
              mountPath: {{ printf "%s/config.json" .Values.config.configPath | quote }}
              subPath: config.json
              readOnly: true
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "affine.fullname" . }}-storage
        - name: config
          secret:
            secretName: {{ .Values.secrets.existingSecret | quote }}
            items:
              - key: config.json
                path: config.json
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
