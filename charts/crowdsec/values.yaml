secrets:
  existingSecret: crowdsec-secrets

# Safety default to avoid nil-pointer if older postgresql templates are still present.
postgresql:
  enabled: true
  image: postgres:17-alpine
  serviceName: crowdsec-postgres
  port: 5432
  storage:
    size: 10Gi
    accessModes: ["ReadWriteOnce"]
    storageClassName: ""

ingressRoute:
  enabled: false


# Minimal wrapper: all runtime behavior delegated to official chart.
crowdsec:
  container_runtime: containerd

  agent:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack
    acquisition:
      - namespace: traefik
        podName: traefik-*
        program: traefik
        poll_without_inotify: true
    env:
      - name: COLLECTIONS
        value: "crowdsecurity/traefik"
      - name: GID
        value: "0"
      - name: PARSERS
        value: "crowdsecurity/cri-logs"

  lapi:
    replicas: 1
    storeCAPICredentialsInSecret: false
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack
    env:
      - name: POSTGRES_DB
        valueFrom:
          secretKeyRef:
            name: crowdsec-secrets
            key: POSTGRES_DB
      - name: POSTGRES_USER
        valueFrom:
          secretKeyRef:
            name: crowdsec-secrets
            key: POSTGRES_USER
      - name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: crowdsec-secrets
            key: POSTGRES_PASSWORD

  config:
    config.yaml.local: |
      db_config:
        type: postgresql
        user: ${POSTGRES_USER}
        password: ${POSTGRES_PASSWORD}
        db_name: ${POSTGRES_DB}
        host: crowdsec-postgres.security.svc.cluster.local
        port: 5432
