image:
  repository: freshrss/freshrss
  tag: "1.28.1"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 80

# k3s defaults:
# pods: 10.42.0.0/16
# services: 10.43.0.0/16
env:
  TRUSTED_PROXY: "10.42.0.0/16 10.43.0.0/16 127.0.0.1/32 ::1/128"

persistence:
  enabled: true
  storageClass: "local-path"
  size: 5Gi
  accessModes:
    - ReadWriteOnce

mysql:
  enabled: true
  image:
    repository: mysql
    tag: "9.6.0"
    pullPolicy: IfNotPresent

  service:
    port: 3306

  persistence:
    enabled: true
    storageClass: "local-path"
    size: 3Gi
    accessModes:
      - ReadWriteOnce

  existingSecret: "freshrss-secrets-db"

oidc:
  enabled: true
  existingSecret: "freshrss-secrets-oidc"

traefik:

  forwardedHeaders:
    enabled: true
    proto: "https"
    port: "443"

  ingressRoute:
    enabled: true
    entryPoints:
      - web
    host: "rss.nserbin.com"
    pathPrefixes:
      - "/"
    middlewares: []
    tls:
      enabled: false
      secretName: ""

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}