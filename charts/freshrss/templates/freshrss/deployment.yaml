apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "freshrss.fullname" . }}
  labels:
    {{- include "freshrss.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: freshrss
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: freshrss
    spec:
      initContainers:
        - name: wait-mysql
          image: busybox:1.36
          command:
            - sh
            - -lc
            - |
              set -eu
              echo "Waiting for MySQL..."
              until nc -z {{ include "freshrss.fullname" . }}-mysql {{ .Values.mysql.service.port }}; do
                sleep 2
              done
              echo "MySQL is up."

      containers:
        - name: freshrss
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          env:
            - name: TRUSTED_PROXY
              value: {{ .Values.env.TRUSTED_PROXY | quote }}

            {{- if .Values.oidc.enabled }}
            - name: OIDC_ENABLED
              value: "1"
            - name: OIDC_X_FORWARDED_HEADERS
              value: "X-Forwarded-Port X-Forwarded-Proto X-Forwarded-Host"
            - name: OIDC_SCOPES
              value: "openid email profile"
            {{- end }}

          {{- if .Values.oidc.enabled }}
          envFrom:
            - secretRef:
                name: {{ .Values.oidc.existingSecret | quote }}
          {{- end }}

          ports:
            - name: http
              containerPort: 80

          readinessProbe:
            httpGet:
              path: /i/
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /i/
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 6

          volumeMounts:
            - name: freshrss-data
              mountPath: /var/www/FreshRSS/data

      volumes:
        - name: freshrss-data
          persistentVolumeClaim:
            claimName: {{ include "freshrss.fullname" . }}-data
