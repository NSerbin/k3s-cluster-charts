apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "freshrss.fullname" . }}
  labels:
    {{- include "freshrss.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: freshrss
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: freshrss
    spec:
      initContainers:
        - name: wait-mysql
          image: busybox:1.36
          command:
            - sh
            - -lc
            - |
              set -eu
              echo "Waiting for MySQL..."
              until nc -z {{ include "freshrss.fullname" . }}-mysql {{ .Values.mysql.service.port }}; do
                sleep 2
              done
              echo "MySQL is up."

        - name: bootstrap-config
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -lc
            - |
              set -eu

              DATA_DIR="/var/www/FreshRSS/data"
              CFG="${DATA_DIR}/config.php"

              if [ -f "$CFG" ]; then
                echo "config.php already exists ✅"
                exit 0
              fi

              echo "Creating config.php to avoid wizard ✅"

              php -r '
                $base_url = getenv("BASE_URL");
                $db_host  = getenv("DB_HOST");
                $db_port  = (int)getenv("DB_PORT");
                $db_name  = getenv("DB_NAME");
                $db_user  = getenv("DB_USER");
                $db_pass  = getenv("DB_PASSWORD");

                if (!$base_url || !$db_host || !$db_port || !$db_name || !$db_user || !$db_pass) {
                  fwrite(STDERR, "Missing required envs for bootstrap-config\n");
                  exit(1);
                }

                @mkdir("/var/www/FreshRSS/data", 0775, true);

                $cfg = [
                  "environment" => "production",
                  "base_url" => $base_url,

                  // OIDC via Apache module => FreshRSS uses http_auth
                  "auth_type" => "http_auth",
                  "http_auth_auto_register" => true,

                  "api_enabled" => true,

                  "db" => [
                    "type" => "mysql",
                    "host" => $db_host,
                    "port" => $db_port,
                    "user" => $db_user,
                    "password" => $db_pass,
                    "base" => $db_name,
                    "prefix" => "",
                    "connection_uri_params" => "",
                    "pdo_options" => [],
                  ],
                ];

                $out = "<?php\nreturn " . var_export($cfg, true) . ";\n";
                file_put_contents("/var/www/FreshRSS/data/config.php", $out);
                chmod("/var/www/FreshRSS/data/config.php", 0644);
                echo "config.php created ✅\n";
              '

          env:
            - name: BASE_URL
              value: {{ required "freshrss.baseUrl is required" .Values.freshrss.baseUrl | quote }}
            - name: DB_HOST
              value: {{ printf "%s-mysql" (include "freshrss.fullname" .) | quote }}
            - name: DB_PORT
              value: {{ .Values.mysql.service.port | quote }}
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysql.existingSecret | quote }}
                  key: MYSQL_DATABASE
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysql.existingSecret | quote }}
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysql.existingSecret | quote }}
                  key: MYSQL_PASSWORD

          volumeMounts:
            - name: freshrss-data
              mountPath: /var/www/FreshRSS/data

      containers:
        - name: freshrss
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          env:
            - name: TRUSTED_PROXY
              value: {{ .Values.env.TRUSTED_PROXY | quote }}
            {{- if .Values.oidc.enabled }}
            - name: OIDC_ENABLED
              value: "1"
            - name: OIDC_X_FORWARDED_HEADERS
              value: "X-Forwarded-Port X-Forwarded-Proto X-Forwarded-Host"
            - name: OIDC_SCOPES
              value: "openid email profile"
            {{- end }}

          {{- if .Values.oidc.enabled }}
          envFrom:
            - secretRef:
                name: {{ .Values.oidc.existingSecret | quote }}
          {{- end }}

          ports:
            - name: http
              containerPort: 80

          readinessProbe:
            httpGet:
              path: /i/
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /i/
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 6

          volumeMounts:
            - name: freshrss-data
              mountPath: /var/www/FreshRSS/data

      volumes:
        - name: freshrss-data
          persistentVolumeClaim:
            claimName: {{ include "freshrss.fullname" . }}-data
