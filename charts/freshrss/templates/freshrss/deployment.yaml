{{- /*
Safe base URL resolution WITHOUT dig().
If .Values.freshrss or .Values.freshrss.baseUrl is missing, fallback to https://<traefik host>
*/ -}}
{{- $freshrssVals := (index .Values "freshrss") | default (dict) -}}
{{- $baseUrlFromValues := (index $freshrssVals "baseUrl") | default "" -}}
{{- $baseUrlDefault := printf "https://%s" .Values.traefik.ingressRoute.host -}}
{{- $baseUrl := default $baseUrlDefault $baseUrlFromValues -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "freshrss.fullname" . }}
  labels:
    {{- include "freshrss.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: freshrss
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: freshrss
    spec:
      initContainers:
        - name: wait-mysql
          image: busybox:1.36
          command:
            - sh
            - -lc
            - |
              set -eu
              echo "Waiting for MySQL..."
              until nc -z {{ include "freshrss.fullname" . }}-mysql {{ .Values.mysql.service.port }}; do
                sleep 2
              done
              echo "MySQL is up."

        - name: bootstrap-config
          image: busybox:1.36
          command:
            - sh
            - -lc
            - |
              set -eu

              DATA_DIR="/var/www/FreshRSS/data"
              CFG="${DATA_DIR}/config.php"

              if [ -f "$CFG" ]; then
                echo "config.php already exists ✅"
                exit 0
              fi

              echo "Creating config.php to avoid wizard ✅"

              : "${BASE_URL:?missing}"
              : "${DB_HOST:?missing}"
              : "${DB_PORT:?missing}"
              : "${DB_NAME:?missing}"
              : "${DB_USER:?missing}"
              : "${DB_PASSWORD:?missing}"

              mkdir -p "$DATA_DIR"

              # IMPORTANT: heredoc sin indentación para que PHP quede limpio
              cat > "$CFG" <<EOF
<?php
return array(
  'environment' => 'production',
  'base_url' => '${BASE_URL}',

  // Auth: OIDC lo maneja Apache module, FreshRSS queda en http_auth
  'auth_type' => 'http_auth',
  'http_auth_auto_register' => true,

  'api_enabled' => true,

  'db' => array(
    'type' => 'mysql',
    'host' => '${DB_HOST}',
    'port' => (int) '${DB_PORT}',
    'user' => '${DB_USER}',
    'password' => '${DB_PASSWORD}',
    'base' => '${DB_NAME}',
    'prefix' => '',
    'connection_uri_params' => '',
    'pdo_options' => array(),
  ),
);
EOF

              chmod 0644 "$CFG"
              echo "config.php created ✅"

          env:
            - name: BASE_URL
              value: {{ $baseUrl | quote }}
            - name: DB_HOST
              value: {{ printf "%s-mysql" (include "freshrss.fullname" .) | quote }}
            - name: DB_PORT
              value: {{ .Values.mysql.service.port | quote }}
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysql.existingSecret | quote }}
                  key: MYSQL_DATABASE
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysql.existingSecret | quote }}
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysql.existingSecret | quote }}
                  key: MYSQL_PASSWORD

          volumeMounts:
            - name: freshrss-data
              mountPath: /var/www/FreshRSS/data

      containers:
        - name: freshrss
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          env:
            - name: TRUSTED_PROXY
              value: {{ .Values.env.TRUSTED_PROXY | quote }}

            {{- if .Values.oidc.enabled }}
            - name: OIDC_ENABLED
              value: "1"
            - name: OIDC_X_FORWARDED_HEADERS
              value: "X-Forwarded-Port X-Forwarded-Proto X-Forwarded-Host"
            - name: OIDC_SCOPES
              value: "openid email profile"
            {{- end }}

          {{- if .Values.oidc.enabled }}
          envFrom:
            - secretRef:
                name: {{ .Values.oidc.existingSecret | quote }}
          {{- end }}

          ports:
            - name: http
              containerPort: 80

          readinessProbe:
            httpGet:
              path: /i/
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /i/
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 6

          volumeMounts:
            - name: freshrss-data
              mountPath: /var/www/FreshRSS/data

      volumes:
        - name: freshrss-data
          persistentVolumeClaim:
            claimName: {{ include "freshrss.fullname" . }}-data
