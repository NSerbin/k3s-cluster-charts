{{- if .Values.traefik.ingressRoute.enabled -}}
{{- $userMw := .Values.traefik.ingressRoute.middlewares | default (list) -}}
{{- $hasUserMw := gt (len $userMw) 0 -}}
{{- $hasFwd := (.Values.traefik.forwardedHeaders.enabled | default false) -}}
{{- $hasMw := or $hasUserMw $hasFwd -}}

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "freshrss.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "freshrss.labels" . | nindent 4 }}
spec:
  entryPoints:
{{- range .Values.traefik.ingressRoute.entryPoints }}
    - {{ . | quote }}
{{- end }}
  routes:
    - match: Host(`{{ .Values.traefik.ingressRoute.host }}`) && ({{- $first := true -}}{{- range .Values.traefik.ingressRoute.pathPrefixes -}}{{- if not $first }} || {{- end -}}PathPrefix(`{{ . }}`){{- $first = false -}}{{- end -}})
      kind: Rule
{{- if $hasMw }}
      middlewares:
{{- if $hasFwd }}
        - name: {{ include "freshrss.fullname" . }}-forwarded
{{- end }}
{{- range $userMw }}
        - name: {{ .name }}
{{- if .namespace }}
          namespace: {{ .namespace }}
{{- end }}
{{- end }}
{{- end }}
      services:
        - name: {{ include "freshrss.fullname" . }}
          port: {{ .Values.service.port }}

{{- if .Values.traefik.ingressRoute.tls.enabled }}
  tls:
{{- if .Values.traefik.ingressRoute.tls.secretName }}
    secretName: {{ .Values.traefik.ingressRoute.tls.secretName | quote }}
{{- end }}
{{- end }}
{{- end }}
