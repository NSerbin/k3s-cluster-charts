{{- if .Values.traefik.forwardedHeadersMiddleware.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "freshrss.fullname" . }}-forwarded-https
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "freshrss.labels" . | nindent 4 }}
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
      X-Forwarded-Port: "443"
      X-Forwarded-Host: {{ .Values.traefik.ingressRoute.host | quote }}
{{- end }}
