{{- if .Values.ingressRoute.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "linkwarden.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
{{- range .Values.ingressRoute.entryPoints }}
    - {{ . }}
{{- end }}
  routes:
    - match: Host(`{{ .Values.ingressRoute.host }}`) && PathPrefix(`{{ .Values.ingressRoute.pathPrefix | default "/" }}`)
      kind: Rule
      services:
        - name: {{ include "linkwarden.fullname" . }}
          port: {{ .Values.service.port }}
          scheme: http
{{- if gt (len .Values.ingressRoute.middlewares) 0 }}
      middlewares:
{{- range .Values.ingressRoute.middlewares }}
        - name: {{ .name }}
          namespace: {{ .namespace | default $.Release.Namespace }}
{{- end }}
{{- end }}
{{- if .Values.ingressRoute.tls.enabled }}
  tls:
{{- if .Values.ingressRoute.tls.secretName }}
    secretName: {{ .Values.ingressRoute.tls.secretName }}
{{- end }}
{{- end }}
{{- end }}
