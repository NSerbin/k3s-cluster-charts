{{- if and .Values.ollama.enabled .Values.ollama.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "linkwarden.fullname" . }}-ollama-data
  labels:
    {{- include "linkwarden.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  {{- if .Values.ollama.persistence.storageClassName }}
  storageClassName: {{ .Values.ollama.persistence.storageClassName | quote }}
  {{- end }}
  accessModes:
    {{- toYaml .Values.ollama.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.ollama.persistence.size }}
{{- end }}
