{{- if .Values.meilisearch.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "linkwarden.fullname" . }}-meilisearch
  labels:
    {{- include "linkwarden.labels" . | nindent 4 }}
    app.kubernetes.io/component: meilisearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: meilisearch
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: meilisearch
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ include "linkwarden.name" . }}
    spec:
      containers:
        - name: meilisearch
          image: "{{ .Values.meilisearch.image.repository }}:{{ .Values.meilisearch.image.tag }}"
          imagePullPolicy: {{ .Values.meilisearch.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 7700

          env:
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.appSecretName }}
                  key: MEILI_MASTER_KEY

            - name: MEILI_NO_ANALYTICS
              value: "true"

          {{- if .Values.meilisearch.persistence.enabled }}
          volumeMounts:
            - name: meili
              mountPath: /meili_data
          {{- end }}

          livenessProbe:
            httpGet:
              path: /health
              port: 7700
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          readinessProbe:
            httpGet:
              path: /health
              port: 7700
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

      {{- if .Values.meilisearch.persistence.enabled }}
      volumes:
        - name: meili
          persistentVolumeClaim:
            claimName: {{ include "linkwarden.fullname" . }}-meili
      {{- end }}
{{- end }}
