{{- if and .Values.postgres.enabled .Values.postgres.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "linkwarden.fullname" . }}-postgres
  labels:
    {{- include "linkwarden.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: 5432
{{- end }}
