{{- if .Values.ollama.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "linkwarden.fullname" . }}-ollama
  labels:
    {{- include "linkwarden.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "linkwarden.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "linkwarden.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ollama
    spec:
      terminationGracePeriodSeconds: 20

      {{- if .Values.ollama.modelPull.enabled }}
      initContainers:
        - name: pull-model
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              set -euo pipefail
              echo "Starting temporary ollama server..."
              ollama serve >/tmp/ollama.log 2>&1 &
              pid=$!
              echo "Waiting for server..."
              for i in $(seq 1 60); do
                if curl -sS http://127.0.0.1:11434/ >/dev/null 2>&1; then
                  break
                fi
                sleep 1
              done
              echo "Pulling model: {{ .Values.ollama.modelPull.model }}"
              ollama pull "{{ .Values.ollama.modelPull.model }}"
              echo "Stopping server..."
              kill $pid || true
              sleep 2
          {{- if .Values.ollama.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /root/.ollama
          {{- end }}
          {{- if .Values.ollama.resources }}
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          {{- end }}
      {{- end }}

      containers:
        - name: ollama
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 11434

          {{- if .Values.ollama.extraEnv }}
          env:
            {{- range $k, $v := .Values.ollama.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}

          {{- if .Values.ollama.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /root/.ollama
          {{- end }}

          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6

          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6

          {{- if .Values.ollama.resources }}
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          {{- end }}

      {{- if .Values.ollama.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "linkwarden.fullname" . }}-ollama-data
      {{- end }}
{{- end }}
