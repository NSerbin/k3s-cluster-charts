fullnameOverride: llama-cpp

image:
  repository: ghcr.io/ggml-org/llama.cpp
  tag: server
  pullPolicy: IfNotPresent

model:
  # A fast multilingual model for short, structured automation tasks on 2 vCPU.
  repository: bartowski/Qwen_Qwen3-0.6B-GGUF
  quantization: Q4_K_M
  alias: qwen3-0.6b
  cachePath: /root/.cache

service:
  port: 8080

persistence:
  storageClassName: local-path
  size: 4Gi

apiKey:
  secretName: llama-cpp-secrets-app
  key: LLAMA_API_KEY

resources:
  requests:
    cpu: "1500m"
    memory: 3Gi
  limits:
    cpu: "2"
    memory: 4Gi

nodeSelector:
  kubernetes.io/hostname: k3s-worker-4

tolerations:
  - key: workload
    operator: Equal
    value: ai
    effect: NoSchedule

server:
  contextSize: 2048
  parallel: 1
  threads: 2
  # This endpoint serves structured automation, where hidden reasoning only adds latency.
  reasoning: "off"
