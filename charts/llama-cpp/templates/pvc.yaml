apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "llama-cpp.fullname" . }}-models
  labels:
    {{- include "llama-cpp.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
