apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "attic.fullname" . }}
  labels:
    {{- include "attic.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.traefik.entryPoints | nindent 4 }}
  routes:
    - match: Host(`{{ .Values.traefik.host }}`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: {{ include "attic.fullname" . }}
          port: {{ .Values.service.port }}
