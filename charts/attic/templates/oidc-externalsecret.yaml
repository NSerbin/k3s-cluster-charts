apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: attic-oidc-secrets
  labels:
    {{- include "attic.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: attic-oidc-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ATTIC_OIDC_CLIENT_ID
      remoteRef:
        key: {{ .Values.secrets.vaultPath | quote }}
        property: ATTIC_OIDC_CLIENT_ID
    - secretKey: ATTIC_OIDC_CLIENT_SECRET
      remoteRef:
        key: {{ .Values.secrets.vaultPath | quote }}
        property: ATTIC_OIDC_CLIENT_SECRET
