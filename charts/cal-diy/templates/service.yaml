apiVersion: v1
kind: Service
metadata:
  name: {{ include "cal-diy.fullname" . }}
  labels:
    {{- include "cal-diy.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "cal-diy.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
---
{{- if .Values.studio.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cal-diy.studioName" . }}
  labels:
    {{- include "cal-diy.labels" . | nindent 4 }}
    app.kubernetes.io/component: studio
spec:
  type: {{ .Values.studio.service.type }}
  ports:
    - name: http
      port: {{ .Values.studio.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "cal-diy.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: studio
{{- end }}
