apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "authentik.fullname" . }}-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "authentik.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: server
      {{- include "authentik.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/blueprints-apps: {{ include (print $.Template.BasePath "/blueprints-apps-configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/component: server
        {{- include "authentik.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: authentik
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["server"]
          ports:
            - containerPort: 9000
              name: http
          env:
            - name: AUTHENTIK_LOG_LEVEL
              value: {{ .Values.authentik.logLevel | quote }}

            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: AUTHENTIK_SECRET_KEY
            {{- if .Values.bootstrap.enabled }}
            - name: AUTHENTIK_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: {{ .Values.bootstrap.adminPasswordKey | quote }}
            {{- end }}
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: {{ .Values.postgresql.serviceName | quote }}
            - name: AUTHENTIK_POSTGRESQL__PORT
              value: {{ .Values.postgresql.port | quote }}
            - name: AUTHENTIK_POSTGRESQL__NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.postgresql.dbNameKey }}
            - name: AUTHENTIK_POSTGRESQL__USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.postgresql.userKey }}
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.postgresql.passwordKey }}
          {{- with .Values.authentik.extraEnvFromSecrets }}
          envFrom:
            {{- range . }}
            - secretRef:
                {{- if kindIs "string" . }}
                name: {{ . | quote }}
                {{- else }}
                name: {{ .name | quote }}
                optional: {{ .optional | default false }}
                {{- end }}
            {{- end }}
          {{- end }}
          {{- if and .Values.blueprints.enabled .Values.blueprints.apps.enabled }}
          volumeMounts:
            - name: authentik-blueprints-apps
              mountPath: {{ printf "%s/%s" (.Values.blueprints.mountPath | default "/blueprints/k3s") (.Values.blueprints.apps.fileName | default "apps.yaml") | quote }}
              subPath: {{ .Values.blueprints.apps.fileName | default "apps.yaml" | quote }}
          {{- end }}

          resources:
            {{- toYaml .Values.resources.server | nindent 12 }}
      {{- if and .Values.blueprints.enabled .Values.blueprints.apps.enabled }}
      volumes:
        - name: authentik-blueprints-apps
          configMap:
            name: {{ include "authentik.fullname" . }}-blueprints-apps
      {{- end }}
