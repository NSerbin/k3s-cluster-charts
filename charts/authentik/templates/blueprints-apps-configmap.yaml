{{- if and .Values.blueprints.enabled .Values.blueprints.apps.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "authentik.fullname" . }}-blueprints-apps
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "authentik.labels" . | nindent 4 }}
data:
  {{ .Values.blueprints.apps.fileName | default "apps.yaml" }}: |
    version: 1
    metadata:
      name: K3s - Authentik managed applications
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: k3s-trek-provider
        identifiers:
          name: k3s-trek-provider
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          issuer_mode: per_provider
          client_type: confidential
          client_id: !Env TREK_OIDC_CLIENT_ID
          client_secret: !Env TREK_OIDC_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://travels.nserbin.com/api/auth/oidc/callback
              redirect_uri_type: authorization
          grant_types:
            - authorization_code
            - refresh_token
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

      - model: authentik_core.application
        identifiers:
          slug: trek
        attrs:
          provider: !KeyOf k3s-trek-provider
          name: k3s-trek
          meta_launch_url: https://travels.nserbin.com

      - model: authentik_crypto.certificatekeypair
        identifiers:
          name: k3s-appflowy-saml
        attrs:
          certificate_data: !Env APPFLOWY_SAML_CERT
          key_data: !Env APPFLOWY_SAML_PRIVATE_KEY

      - model: authentik_providers_saml.samlprovider
        id: k3s-appflowy-provider
        identifiers:
          name: k3s-appflowy-provider
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          acs_url: https://wiki.nserbin.com/gotrue/sso/saml/acs
          audience: https://wiki.nserbin.com/gotrue/sso/saml/metadata
          sp_binding: post
          signing_kp: !Find [authentik_crypto.certificatekeypair, [name, k3s-appflowy-saml]]
          verification_kp: !Find [authentik_crypto.certificatekeypair, [name, k3s-appflowy-saml]]
          name_id_mapping: !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/email]]
          default_relay_state: https://wiki.nserbin.com/auth/callback
          sign_assertion: true
          sign_response: true
          digest_algorithm: http://www.w3.org/2001/04/xmlenc#sha256
          signature_algorithm: http://www.w3.org/2001/04/xmldsig-more#rsa-sha256
          property_mappings:
            - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/email]]
            - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/name]]
            - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/username]]

      - model: authentik_core.application
        identifiers:
          slug: appflowy
        attrs:
          provider: !KeyOf k3s-appflowy-provider
          name: k3s-appflowy
          meta_launch_url: https://wiki.nserbin.com

      - model: authentik_providers_oauth2.oauth2provider
        id: k3s-homepage-provider
        identifiers:
          name: k3s-homepage-provider
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          issuer_mode: per_provider
          client_type: confidential
          client_id: !Env HOMEPAGE_OIDC_CLIENT_ID
          client_secret: !Env HOMEPAGE_OIDC_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://home.nserbin.com/api/auth/callback/homepage-oidc
              redirect_uri_type: authorization
          grant_types:
            - authorization_code
            - refresh_token
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

      - model: authentik_core.application
        identifiers:
          slug: homepage
        attrs:
          provider: !KeyOf k3s-homepage-provider
          name: k3s-homepage
          meta_launch_url: https://home.nserbin.com
{{- end }}
