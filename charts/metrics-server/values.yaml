metrics-server:
  replicas: 1

  apiService:
    create: true

  deploymentAnnotations:
    argocd.argoproj.io/sync-options: Force=true,Replace=true

  args:
    - --kubelet-insecure-tls

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

  nodeSelector: {}
  affinity: {}

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  metrics:
    enabled: true
    
  serviceMonitor:
    enabled: true
    interval: 1m
    scrapeTimeout: 10s
    additionalLabels:
      release: kube-prometheus-stack
