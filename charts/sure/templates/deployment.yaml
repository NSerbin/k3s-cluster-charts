apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sure.fullname" . }}
  labels:
    {{- include "sure.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sure.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "sure.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ include "sure.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-postgres
          image: {{ include "sure.waitImage" . | quote }}
          imagePullPolicy: {{ .Values.waitImage.pullPolicy }}
          command: ["sh", "-ec", "until nc -z {{ include "sure.postgresName" . }} {{ .Values.postgres.service.port }}; do sleep 2; done"]
        - name: wait-redis
          image: {{ include "sure.waitImage" . | quote }}
          imagePullPolicy: {{ .Values.waitImage.pullPolicy }}
          command: ["sh", "-ec", "until nc -z {{ include "sure.redisName" . }} {{ .Values.redis.service.port }}; do sleep 2; done"]
        {{- if .Values.migrations.enabled }}
        - name: migrations
          image: {{ include "sure.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.migrations.command | nindent 12 }}
          args:
            - {{ .Values.migrations.args | quote }}
          env:
            {{- include "sure.env" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
        {{- end }}
      containers:
        - name: sure
          image: {{ include "sure.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.web.command }}
          command:
            {{- toYaml .Values.web.command | nindent 12 }}
          {{- end }}
          {{- if .Values.web.args }}
          args:
            {{- toYaml .Values.web.args | nindent 12 }}
          {{- end }}
          env:
            {{- include "sure.env" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          {{- if .Values.storage.persistence.enabled }}
          volumeMounts:
            - name: storage
              mountPath: /rails/storage
          {{- end }}
      {{- if .Values.storage.persistence.enabled }}
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "sure.fullname" . }}-storage
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sure.fullname" . }}-worker
  labels:
    {{- include "sure.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "sure.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "sure.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "sure.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-postgres
          image: {{ include "sure.waitImage" . | quote }}
          imagePullPolicy: {{ .Values.waitImage.pullPolicy }}
          command: ["sh", "-ec", "until nc -z {{ include "sure.postgresName" . }} {{ .Values.postgres.service.port }}; do sleep 2; done"]
        - name: wait-redis
          image: {{ include "sure.waitImage" . | quote }}
          imagePullPolicy: {{ .Values.waitImage.pullPolicy }}
          command: ["sh", "-ec", "until nc -z {{ include "sure.redisName" . }} {{ .Values.redis.service.port }}; do sleep 2; done"]
      containers:
        - name: sure-worker
          image: {{ include "sure.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.worker.command | nindent 12 }}
          args:
            {{- toYaml .Values.worker.args | nindent 12 }}
          env:
            {{- include "sure.env" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- if .Values.storage.persistence.enabled }}
          volumeMounts:
            - name: storage
              mountPath: /rails/storage
          {{- end }}
      {{- if .Values.storage.persistence.enabled }}
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "sure.fullname" . }}-storage
      {{- end }}
{{- end }}
