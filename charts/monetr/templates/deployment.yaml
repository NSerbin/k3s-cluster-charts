apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monetr.fullname" . }}
  labels:
    {{- include "monetr.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "monetr.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "monetr.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "monetr.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-postgres
          image: {{ include "monetr.waitImage" . | quote }}
          imagePullPolicy: {{ .Values.waitImage.pullPolicy }}
          command: ["sh", "-ec", "until nc -z {{ include "monetr.postgresName" . }} {{ .Values.postgres.service.port }}; do sleep 2; done"]
        - name: wait-redis
          image: {{ include "monetr.waitImage" . | quote }}
          imagePullPolicy: {{ .Values.waitImage.pullPolicy }}
          command: ["sh", "-ec", "until nc -z {{ include "monetr.redisName" . }} {{ .Values.redis.service.port }}; do sleep 2; done"]
        {{- if .Values.minio.enabled }}
        - name: wait-minio
          image: {{ include "monetr.waitImage" . | quote }}
          imagePullPolicy: {{ .Values.waitImage.pullPolicy }}
          command: ["sh", "-ec", "until nc -z {{ include "monetr.minioName" . }} {{ .Values.minio.service.apiPort }}; do sleep 2; done"]
        {{- end }}
        - name: migrations
          image: {{ include "monetr.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/bin/monetr"]
          args: ["-c", "/etc/monetr/config.yaml", "database", "migrate"]
          env:
            {{- include "monetr.env" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            {{- include "monetr.volumeMounts" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      containers:
        - name: monetr
          image: {{ include "monetr.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/bin/monetr"]
          args: ["-c", "/etc/monetr/config.yaml", "serve"]
          env:
            {{- include "monetr.env" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            {{- include "monetr.volumeMounts" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "monetr.fullname" . }}-config
        - name: certificate
          secret:
            secretName: {{ .Values.secrets.existingSecret | quote }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- define "monetr.env" -}}
- name: MONETR_ENVIRONMENT
  value: {{ .Values.config.environment | quote }}
- name: MONETR_PG_ADDRESS
  value: {{ include "monetr.postgresName" . | quote }}
- name: MONETR_PG_PORT
  value: {{ .Values.postgres.service.port | quote }}
- name: MONETR_PG_USERNAME
  valueFrom:
    secretKeyRef:
      name: {{ .Values.secrets.existingSecret | quote }}
      key: POSTGRES_USER
- name: MONETR_PG_PASSWORD
  valueFrom:
    secretKeyRef:
      name: {{ .Values.secrets.existingSecret | quote }}
      key: POSTGRES_PASSWORD
- name: MONETR_PG_DATABASE
  valueFrom:
    secretKeyRef:
      name: {{ .Values.secrets.existingSecret | quote }}
      key: POSTGRES_DB
- name: MONETR_REDIS_ENABLED
  value: "true"
- name: MONETR_REDIS_ADDRESS
  value: {{ include "monetr.redisName" . | quote }}
- name: MONETR_REDIS_PORT
  value: {{ .Values.redis.service.port | quote }}
- name: MONETR_REDIS_DATABASE
  value: {{ .Values.redis.database | quote }}
- name: MONETR_STORAGE_ENABLED
  value: {{ .Values.minio.enabled | quote }}
- name: MONETR_STORAGE_PROVIDER
  value: "s3"
- name: MONETR_KMS_PROVIDER
  value: {{ .Values.kms.provider | quote }}
- name: AWS_ACCESS_KEY
  valueFrom:
    secretKeyRef:
      name: {{ .Values.secrets.existingSecret | quote }}
      key: MINIO_ACCESS_KEY
- name: AWS_SECRET_KEY
  valueFrom:
    secretKeyRef:
      name: {{ .Values.secrets.existingSecret | quote }}
      key: MINIO_SECRET_KEY
- name: AWS_ACCESS_KEY_ID
  valueFrom:
    secretKeyRef:
      name: {{ .Values.secrets.existingSecret | quote }}
      key: MINIO_ACCESS_KEY
- name: AWS_SECRET_ACCESS_KEY
  valueFrom:
    secretKeyRef:
      name: {{ .Values.secrets.existingSecret | quote }}
      key: MINIO_SECRET_KEY
{{- end -}}

{{- define "monetr.volumeMounts" -}}
- name: config
  mountPath: /etc/monetr/config.yaml
  readOnly: true
  subPath: config.yaml
- name: certificate
  mountPath: /etc/monetr/certificate/ed25519.key
  readOnly: true
  subPath: {{ .Values.secrets.certificateKey | quote }}
{{- end -}}
