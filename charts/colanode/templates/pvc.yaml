{{- if .Values.postgres.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "colanode.postgresName" . }}-data
  labels:
    {{- include "colanode.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  accessModes:
    {{- toYaml .Values.postgres.persistence.accessModes | nindent 4 }}
  storageClassName: {{ .Values.postgres.persistence.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size | quote }}
{{- end }}
---
{{- if .Values.redis.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "colanode.redisName" . }}-data
  labels:
    {{- include "colanode.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  accessModes:
    {{- toYaml .Values.redis.persistence.accessModes | nindent 4 }}
  storageClassName: {{ .Values.redis.persistence.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.redis.persistence.size | quote }}
{{- end }}
---
{{- if .Values.persistence.storage.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "colanode.fullname" . }}-storage
  labels:
    {{- include "colanode.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
spec:
  accessModes:
    {{- toYaml .Values.persistence.storage.accessModes | nindent 4 }}
  storageClassName: {{ .Values.persistence.storage.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.storage.size | quote }}
{{- end }}
