apiVersion: v1
kind: Service
metadata:
  name: {{ include "bentopdf.fullname" . }}
  labels:
    {{- include "bentopdf.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "bentopdf.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
