{{- if .Values.traefik.ingressRoute.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "bentopdf.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bentopdf.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.traefik.ingressRoute.entryPoints | nindent 4 }}
  routes:
    {{- if .Values.traefik.ingressRoute.mjsContentTypeFix.enabled }}
    - match: Host(`{{ .Values.traefik.ingressRoute.host }}`) && PathRegexp(`{{ .Values.traefik.ingressRoute.mjsContentTypeFix.pathRegexp }}`)
      kind: Rule
      priority: 10
      middlewares:
        {{- range .Values.traefik.ingressRoute.middlewares }}
        - name: {{ .name }}
          {{- if .namespace }}
          namespace: {{ .namespace }}
          {{- end }}
        {{- end }}
        - name: {{ .Values.traefik.ingressRoute.mjsContentTypeFix.middlewareName }}
      services:
        - name: {{ include "bentopdf.fullname" . }}
          port: {{ .Values.service.port }}
          scheme: http
    {{- end }}
    - match: Host(`{{ .Values.traefik.ingressRoute.host }}`) && ({{- $first := true -}}{{- range .Values.traefik.ingressRoute.pathPrefixes -}}{{- if not $first }} || {{- end -}}PathPrefix(`{{ . }}`){{- $first = false -}}{{- end -}})
      kind: Rule
      {{- if .Values.traefik.ingressRoute.middlewares }}
      middlewares:
        {{- range .Values.traefik.ingressRoute.middlewares }}
        - name: {{ .name }}
          {{- if .namespace }}
          namespace: {{ .namespace }}
          {{- end }}
        {{- end }}
      {{- end }}
      services:
        - name: {{ include "bentopdf.fullname" . }}
          port: {{ .Values.service.port }}
          scheme: http
  {{- if .Values.traefik.ingressRoute.tls.enabled }}
  tls:
    {{- if .Values.traefik.ingressRoute.tls.secretName }}
    secretName: {{ .Values.traefik.ingressRoute.tls.secretName | quote }}
    {{- end }}
  {{- end }}
{{- end }}
