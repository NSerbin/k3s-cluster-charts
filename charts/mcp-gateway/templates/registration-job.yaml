{{- if or .Values.registration.enabled .Values.configuration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-bootstrap
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: {{ .Values.registration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.registration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.registration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "mcp-gateway.labels" . | nindent 8 }}
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: bootstrap
          image: "{{ .Values.registration.image.repository }}:{{ .Values.registration.image.tag }}"
          imagePullPolicy: {{ .Values.registration.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - /bin/sh
            - -lc
            - |
              set -eu
              python -m pip install --no-cache-dir --target {{ .Values.runtime.installPath | quote }}{{- range .Values.runtime.packages }} {{ . | quote }}{{- end }}
              export PYTHONPATH={{ .Values.runtime.installPath | quote }}
              export PATH={{ printf "%s/bin:$PATH" .Values.runtime.installPath | quote }}

              for i in $(seq 1 60); do
                if python3 - <<'PY'
              import urllib.request
              try:
                  with urllib.request.urlopen("http://{{ include "mcp-gateway.fullname" . }}:{{ .Values.service.port }}/health", timeout=3) as response:
                      raise SystemExit(0 if response.status == 200 else 1)
              except Exception:
                  raise SystemExit(1)
              PY
                then
                  break
                fi
                sleep 2
              done

              python3 - <<'PY'
              import json
              import os
              import time
              import urllib.error
              import urllib.request
              import uuid

              import jwt

              base = "http://{{ include "mcp-gateway.fullname" . }}:{{ .Values.service.port }}"
              desired_gateways = {{ .Values.registration.gateways | toJson }}
              now = int(time.time())
              admin_email = os.environ["PLATFORM_ADMIN_EMAIL"]
              token = jwt.encode(
                  {
                      "sub": admin_email,
                      "username": admin_email,
                      "user": {
                          "email": admin_email,
                          "full_name": os.environ.get("PLATFORM_ADMIN_FULL_NAME", admin_email),
                          "is_admin": True,
                          "auth_provider": "cli",
                      },
                      "teams": None,
                      "iss": os.environ.get("JWT_ISSUER", "mcpgateway"),
                      "aud": os.environ.get("JWT_AUDIENCE", "mcpgateway-api"),
                      "env": os.environ.get("ENVIRONMENT", "production"),
                      "iat": now,
                      "exp": now + 3600,
                      "jti": str(uuid.uuid4()),
                  },
                  os.environ["JWT_SECRET_KEY"],
                  algorithm=os.environ.get("JWT_ALGORITHM", "HS256"),
              )

              def api(method, path, payload=None):
                  body = json.dumps(payload).encode("utf-8") if payload is not None else None
                  req = urllib.request.Request(base + path, data=body, method=method)
                  req.add_header("Authorization", f"Bearer {token}")
                  req.add_header("Content-Type", "application/json")
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read().decode("utf-8")
                      return json.loads(raw) if raw else {}

              {{- if .Values.registration.enabled }}
              current = api("GET", "/gateways")
              by_name = {gateway.get("name"): gateway for gateway in current}

              for gateway in desired_gateways:
                  existing = by_name.get(gateway["name"])
                  if existing:
                      existing_id = existing["id"]
                      try:
                          api("DELETE", f"/gateways/{existing_id}")
                      except Exception:
                          pass

                  api("POST", "/gateways", {
                      "name": gateway["name"],
                      "url": gateway["url"],
                      "transport": gateway["transport"],
                  })

              print("mcp upstream registration complete")
              {{- end }}
              PY

              {{- if .Values.configuration.enabled }}
              python3 - <<'PY'
              import asyncio
              import os
              import time

              from sqlalchemy import select

              from mcpgateway.db import EmailTeam, EmailTeamMember, EmailUser, Server, Tool, get_db
              from mcpgateway.schemas import ServerCreate, ServerUpdate
              from mcpgateway.services.server_service import ServerNameConflictError, ServerService
              from mcpgateway.services.team_management_service import (
                  MemberAlreadyExistsError,
                  TeamManagementError,
                  TeamManagementService,
                  UserNotFoundError,
              )

              desired_teams = {{ .Values.configuration.teams | default (list) | toJson }}
              desired_virtual_servers = {{ .Values.configuration.virtualServers | default (list) | toJson }}
              admin_email = os.environ["PLATFORM_ADMIN_EMAIL"].strip().lower()

              async def reconcile():
                  db = next(get_db())
                  team_service = TeamManagementService(db)
                  server_service = ServerService()

                  admin = db.query(EmailUser).filter(EmailUser.email == admin_email).first()
                  if not admin:
                      raise RuntimeError(f"Platform admin user {admin_email} does not exist")

                  for desired in desired_teams:
                      name = desired["name"]
                      slug = desired.get("slug") or name.lower().replace(" ", "-")
                      description = desired.get("description")
                      visibility = desired.get("visibility", "private")
                      max_members = desired.get("maxMembers")
                      members = desired.get("members") or []

                      team = db.execute(
                          select(EmailTeam).where(EmailTeam.slug == slug)
                      ).scalar_one_or_none()

                      if team:
                          if team.is_personal:
                              raise RuntimeError(f"Refusing to manage personal team with slug {slug}")
                          await team_service.update_team(
                              team_id=team.id,
                              name=name,
                              description=description,
                              visibility=visibility,
                              max_members=max_members,
                              updated_by=admin_email,
                              skip_limits=True,
                          )
                          db.commit()
                          print(f"updated team {slug}")
                      else:
                          team = await team_service.create_team(
                              name=name,
                              description=description,
                              created_by=admin_email,
                              visibility=visibility,
                              max_members=max_members,
                              skip_limits=True,
                          )
                          if team.slug != slug:
                              team.slug = slug
                              db.commit()
                          print(f"created team {slug}")

                      for member in members:
                          email = str(member["email"]).strip().lower()
                          role = str(member.get("role", "member")).strip().lower()
                          if role not in {"owner", "member"}:
                              raise RuntimeError(f"Invalid role {role} for {email} in team {slug}")

                          existing = db.query(EmailTeamMember).filter(
                              EmailTeamMember.team_id == team.id,
                              EmailTeamMember.user_email == email,
                              EmailTeamMember.is_active.is_(True),
                          ).first()

                          if existing:
                              if existing.role != role:
                                  await team_service.update_member_role(team.id, email, role)
                                  db.commit()
                                  print(f"updated member {email} as {role} in {slug}")
                              continue

                          try:
                              await team_service.add_member_to_team(
                                  team_id=team.id,
                                  user_email=email,
                                  role=role,
                                  invited_by=admin_email,
                                  grant_source="bootstrap",
                              )
                              db.commit()
                              print(f"added member {email} as {role} in {slug}")
                          except UserNotFoundError:
                              print(f"skipped missing user {email} for team {slug}")
                          except MemberAlreadyExistsError:
                              pass
                          except TeamManagementError as exc:
                              raise RuntimeError(f"failed to manage member {email} in {slug}: {exc}") from exc

                  desired_tool_names = {
                      tool_name
                      for virtual_server in desired_virtual_servers
                      for tool_name in (virtual_server.get("tools") or [])
                  }
                  tools_by_name = {}
                  for attempt in range(30):
                      tools_by_name = {
                          tool.name: tool
                          for tool in db.query(Tool)
                          .filter(Tool.enabled.is_(True))
                          .all()
                      }
                      missing = desired_tool_names - set(tools_by_name)
                      if not missing:
                          break
                      print(f"waiting for gateway tool discovery: {', '.join(sorted(missing))}")
                      db.rollback()
                      time.sleep(3)
                  teams_by_slug = {
                      team.slug: team
                      for team in db.query(EmailTeam)
                      .filter(EmailTeam.is_active.is_(True))
                      .all()
                  }

                  for desired in desired_virtual_servers:
                      name = desired["name"]
                      tool_names = desired.get("tools") or []
                      missing_tools = [tool_name for tool_name in tool_names if tool_name not in tools_by_name]
                      if missing_tools:
                          raise RuntimeError(f"Missing tools for virtual server {name}: {', '.join(missing_tools)}")

                      team_slug = desired.get("teamSlug")
                      team_id = None
                      if team_slug:
                          team = teams_by_slug.get(team_slug)
                          if not team:
                              raise RuntimeError(f"Missing team slug {team_slug} for virtual server {name}")
                          team_id = team.id

                      associated_tool_ids = [tools_by_name[tool_name].id for tool_name in tool_names]
                      visibility = desired.get("visibility", "private")

                      existing = db.query(Server).filter(
                          Server.name == name,
                          Server.owner_email == admin_email,
                          Server.team_id == team_id,
                      ).first()

                      payload = {
                          "name": name,
                          "description": desired.get("description"),
                          "icon": desired.get("icon"),
                          "tags": desired.get("tags") or [],
                          "associated_tools": associated_tool_ids,
                          "associated_resources": desired.get("resources") or [],
                          "associated_prompts": desired.get("prompts") or [],
                          "team_id": team_id,
                          "owner_email": admin_email,
                          "visibility": visibility,
                      }

                      if existing:
                          update_payload = ServerUpdate(**payload)
                          await server_service.update_server(
                              db,
                              existing.id,
                              update_payload,
                              admin_email,
                              modified_by=admin_email,
                              modified_via="bootstrap",
                          )
                          db.commit()
                          print(f"updated virtual server {name}")
                      else:
                          create_payload = ServerCreate(**payload)
                          try:
                              await server_service.register_server(
                                  db,
                                  create_payload,
                                  created_by=admin_email,
                                  created_via="bootstrap",
                                  team_id=team_id,
                                  owner_email=admin_email,
                                  visibility=visibility,
                              )
                              db.commit()
                              print(f"created virtual server {name}")
                          except ServerNameConflictError:
                              db.rollback()
                              raise

                  db.close()
                  await server_service.shutdown()

              asyncio.run(reconcile())
              print("mcp gateway ContextForge configuration complete")
              PY
              {{- end }}
          env:
            - name: POSTGRES_HOST
              value: {{ printf "%s-postgres" (include "mcp-gateway.fullname" .) | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgresql.service.port | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dbSecretName | quote }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dbSecretName | quote }}
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: >-
                postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)
            - name: REDIS_URL
              value: redis://{{ include "mcp-gateway.fullname" . }}-redis:{{ .Values.redis.service.port }}/0
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.appSecretName | quote }}
            - configMapRef:
                name: {{ include "mcp-gateway.fullname" . }}-config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
