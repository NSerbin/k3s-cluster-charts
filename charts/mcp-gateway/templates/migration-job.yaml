{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-migration
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "mcp-gateway.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migration
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - /bin/sh
            - -lc
            - |
              set -eu
              python -m pip install --no-cache-dir --target {{ .Values.runtime.installPath | quote }} {{ .Values.runtime.package | quote }}
              export PYTHONPATH={{ .Values.runtime.installPath | quote }}
              export PATH={{ printf "%s/bin:$PATH" .Values.runtime.installPath | quote }}
              python -m mcpgateway.utils.db_isready --max-tries 30 --interval 2 --timeout 5
              python -m mcpgateway.bootstrap_db
          env:
            - name: POSTGRES_HOST
              value: {{ printf "%s-postgres" (include "mcp-gateway.fullname" .) | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgresql.service.port | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dbSecretName | quote }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dbSecretName | quote }}
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: >-
                postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)
            - name: REDIS_URL
              value: redis://{{ include "mcp-gateway.fullname" . }}-redis:{{ .Values.redis.service.port }}/0
          envFrom:
            - configMapRef:
                name: {{ include "mcp-gateway.fullname" . }}-config
            - secretRef:
                name: {{ .Values.secrets.appSecretName | quote }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
