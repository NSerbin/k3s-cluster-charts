fullnameOverride: adguard-home

image:
  repository: adguard/adguardhome
  tag: "v0.107.79"
  pullPolicy: IfNotPresent

dnsService:
  type: LoadBalancer
  loadBalancerIP: 192.168.0.235
  loadBalancerSourceRanges:
    - 192.168.0.0/24
  ports:
    dns: 53
    dot: 853

webService:
  type: ClusterIP
  port: 80

persistence:
  storageClassName: local-path
  configSize: 1Gi
  workSize: 2Gi

traefik:
  ingressRoute:
    enabled: true
    host: adguard.nserbin.com
    entryPoints:
      - web

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector:
  workload.nserbin.com/general: "true"

tolerations: []
affinity: {}
