replicaCount: 1

fullnameOverride: argocd-mcp

image:
  repository: ghcr.io/argoproj-labs/mcp-for-argocd
  tag: "v0.8.0"
  pullPolicy: IfNotPresent

argocd:
  baseUrl: "http://argocd-server.argocd.svc.cluster.local"
  secretName: argocd-mcp-secrets
  tokenKey: ARGOCD_API_TOKEN

mcp:
  port: 3000
  endpointPath: /mcp
  healthPath: /healthz
  readOnly: true
  stateless: true

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
