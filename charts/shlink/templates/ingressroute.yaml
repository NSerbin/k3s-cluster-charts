{{- if .Values.traefik.ingressRoute.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "shlink.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shlink.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- range .Values.traefik.ingressRoute.entryPoints }}
    - {{ . | quote }}
    {{- end }}
  routes:
    - match: Host(`{{ .Values.traefik.ingressRoute.host }}`)
      kind: Rule
      services:
        - name: {{ include "shlink.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
{{- if .Values.traefik.webClientIngressRoute.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "shlink.fullname" . }}-web-client
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shlink.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- range .Values.traefik.webClientIngressRoute.entryPoints }}
    - {{ . | quote }}
    {{- end }}
  routes:
    - match: Host(`{{ .Values.traefik.webClientIngressRoute.host }}`) && PathPrefix(`/outpost.goauthentik.io/`)
      kind: Rule
      priority: 100
      services:
        - name: {{ .Values.authentik.service.name }}
          namespace: {{ .Values.authentik.service.namespace }}
          port: {{ .Values.authentik.service.port }}
    - match: Host(`{{ .Values.traefik.webClientIngressRoute.host }}`)
      kind: Rule
      middlewares:
        - name: {{ include "shlink.fullname" . }}-authentik
      services:
        - name: {{ include "shlink.fullname" . }}-web-client
          port: {{ .Values.webClient.service.port }}
{{- end }}
