version: 2

updates:
  - package-ecosystem: "helm"
    directories:
      - "/charts/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Europe/Lisbon"
    labels:
      - "dependencies"
      - "helm"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(helm)"
      include: "scope"
    groups:
      helm-chart-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "docker"
    directories:
      - "/charts/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:30"
      timezone: "Europe/Lisbon"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(docker)"
      include: "scope"
    groups:
      docker-image-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "gcr.io/zenika-hub/alpine-chrome"
      - dependency-name: "zenika-hub/alpine-chrome"
      - dependency-name: "ghcr.io/nserbin/*"
      - dependency-name: "nserbin/*"
