apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monetr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/NSerbin/k3s-cluster-charts.git
    targetRevision: main
    path: charts/monetr
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: tools
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
