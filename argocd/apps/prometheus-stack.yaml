apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  revisionHistoryLimit: 5
  project: default

  source:
    repoURL: "https://github.com/NSerbin/k3s-cluster-charts.git"
    targetRevision: "main"
    path: "charts/kube-prometheus-stack"
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: kube-prometheus-stack.grafana.admin.existingSecret
          value: grafana-secrets-admin
        - name: kube-prometheus-stack.grafana.admin.userKey
          value: admin-user
        - name: kube-prometheus-stack.grafana.admin.passwordKey
          value: admin-password

  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring

  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: kube-prometheus-stack-postgres
      namespace: monitoring
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.status

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
