AapiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: github-actions-runner
  namespace: argocd
spec:
  revisionHistoryLimit: 5
  project: default

  source:
    repoURL: "https://github.com/NSerbin/k3s-cluster-charts.git"
    targetRevision: main
    path: "charts/github-actions-runner"
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: arc-systems

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
